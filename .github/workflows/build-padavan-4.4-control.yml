name: 'Diagnostic: upstream K2P control build'
run-name: "Diagnostic K2P upstream build — not WR1200JS"

on:
  workflow_dispatch:

jobs:
  build-control:
    # This verifies the pinned upstream base and toolchain with its known K2P
    # target. It does not produce a WR1200JS firmware image.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake autopoint cmake bison build-essential flex \
            gawk gettext git gperf libtool libtool-bin pkg-config fakeroot \
            kmod cpio texinfo help2man libncurses5-dev zlib1g-dev \
            libsqlite3-dev gcc-multilib curl dos2unix unzip wget xxd \
            libltdl-dev libgmp-dev libmpfr-dev libarchive-tools libblkid-dev \
            python3-docutils

      - name: Fetch pinned Padavan 4.4.198 source
        run: |
          git clone https://github.com/hanwckf/padavan-4.4.git padavan-4.4
          git -C padavan-4.4 checkout --detach ff77acc51a4ad5d88660f0ac25a34a1f6f9060c6
          test "$(git -C padavan-4.4 rev-parse HEAD)" = "ff77acc51a4ad5d88660f0ac25a34a1f6f9060c6"

      - name: Restore pinned owned toolchain archive
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mips-toolchains
          key: mips-toolchain-${{ runner.os }}-928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6
      - name: Fetch the upstream MIPS little-endian toolchain
        run: |
          cd padavan-4.4/toolchain-mipsel
          toolchain_cache="$GITHUB_WORKSPACE/.cache/mips-toolchains/928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6.tar.xz"
          mkdir -p "$(dirname "$toolchain_cache")"
          trap 'rm -f -- "$toolchain_cache.part"' EXIT
          if ! echo '928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6  '"$toolchain_cache" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
              --header 'Accept: application/octet-stream' \
              --output "$toolchain_cache.part" \
              https://api.github.com/repos/Andrzej1973/padavan-4.4.198/releases/assets/723466301
            echo '928db92fb2dd2d9f7cc540a40cbadaa2224b582e7b186f46c743d458ad768dc6  '"$toolchain_cache.part" | sha256sum -c -
            mv -- "$toolchain_cache.part" "$toolchain_cache"
          fi
          cp -- "$toolchain_cache" mipsel-linux-uclibc.tar.xz
          sha256sum mipsel-linux-uclibc.tar.xz | tee toolchain-sha256.txt
          mkdir -p toolchain-4.4.x
          tar -xJf mipsel-linux-uclibc.tar.xz -C toolchain-4.4.x

      - name: Build upstream K2P control image
        run: |
          cd padavan-4.4/trunk
          mkdir -p images
          fakeroot ./build_firmware_ci K2P
          image="$(find images -maxdepth 1 -type f -name '*.trx' -print -quit)"
          test -n "$image" && test -s "$image"
          sha256sum "$image"

      - name: Upload control image and toolchain checksum
        uses: actions/upload-artifact@v7
        with:
          name: padavan-linux-4.4.198-k2p-control
          retention-days: 7
          path: |
            padavan-4.4/trunk/images/*.trx
            padavan-4.4/toolchain-mipsel/toolchain-sha256.txt

