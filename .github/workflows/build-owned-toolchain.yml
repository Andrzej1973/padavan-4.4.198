name: Build owned MIPS toolchain
run-name: "${{ inputs.preserve_existing && 'Toolchain preservation' || 'Toolchain source candidate' }} ${{ github.sha }}"
on:
  workflow_dispatch:
    inputs:
      preserve_existing:
        description: 'Preserve the reviewed existing compiler artifact in Release without rebuilding'
        type: boolean
        default: false
      publish_candidate:
        description: 'Publish verified source-built compiler as a separate prerelease; never promote firmware'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: toolchain-source-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  build:
    if: ${{ !inputs.preserve_existing }}
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check recipe and negative fixtures
        run: python3 tools/toolchain/check-recipe.py
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential autoconf automake \
            libtool libtool-bin bison flex gawk help2man texinfo libncurses5-dev \
            python3-dev patch curl xz-utils unzip bzip2 git libssl-dev libexpat1-dev \
            qemu-user
      - uses: actions/cache@v6
        with:
          path: .cache/ctng-source-downloads
          key: ctng-sources-${{ runner.os }}-${{ hashFiles('toolchains/wr1200js/*') }}
      - name: Generate compiler from verified sources and test relocated ABI
        env:
          TOOLCHAIN_SOURCE_CACHE: ${{ github.workspace }}/.cache/ctng-source-downloads
        run: |
          mkdir -p toolchain-results
          df -h .
          bash tools/toolchain/build.sh "$RUNNER_TEMP/wr-toolchain-source" "$GITHUB_WORKSPACE/toolchain-results"
      - name: Preserve source build diagnostics and candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-built-mips-toolchain
          retention-days: 7
          if-no-files-found: error
          path: toolchain-results/
  publish:
    needs: build
    if: inputs.publish_candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-built-mips-toolchain
          path: candidate
      - name: Publish candidate without replacing pinned toolchains
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: toolchain-source-${{ github.run_id }}-${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd candidate
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('result.json').read_text())
          assert r['relocation_tested'] and r['qemu_user_verified'] and not r['production_promoted']
          assert r['device_runtime_verified'] is False
          Path('notes.md').write_text('Source-built MIPSel GCC10.5/uClibc1.0.48 candidate.\n\n'
              'C/C++ and QEMU checks passed. Firmware/kernel/module and physical router acceptance remain open. '
              'This release does not replace the pinned production toolchains. '
              'Exact inputs, package source archives, licenses and SHA256 are attached.\n')
          PY
          gh release create "$CANDIDATE_TAG" ./*.tar.xz SHA256SUMS result.json \
            --target "$SOURCE_SHA" --title "Source-built MIPS toolchain candidate" \
            --notes-file notes.md --prerelease --latest=false

  preserve:
    if: inputs.preserve_existing
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require explicit candidate publication
        env:
          PUBLISH_CANDIDATE: ${{ inputs.publish_candidate }}
        run: test "$PUBLISH_CANDIDATE" = true
      - name: Inspect original reviewed source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/Andrzej1973/padavan-4.4.198/actions/runs/42467546674 > original-run.json
      - uses: actions/download-artifact@v8
        with:
          name: source-built-mips-toolchain
          run-id: 42467546674
          github-token: ${{ github.token }}
          repository: Andrzej1973/padavan-4.4.198
          path: preserved-candidate
      - name: Verify exact artifacts and complete source inventory
        run: |
          python3 tools/toolchain/check-preserved-artifact.py
          python3 tools/toolchain/verify-preserved-artifact.py preserved-candidate original-run.json
      - name: Preserve candidate without changing compiler selection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_TAG: toolchain-preserved-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cd preserved-candidate
          sha256sum -c SHA256SUMS
          cat > notes.md <<'NOTES'
          Preserved GCC10.5/uClibc1.0.48 MIPSel candidate from reviewed source run42467546674.
          Exact compiler, generator/kernel/libc/package sources, licenses, reports and hashes are retained.
          No compiler rebuild, default selection change or physical runtime acceptance is performed here.
          NOTES
          gh release create "$CANDIDATE_TAG" ./*.tar.xz SHA256SUMS result.json preservation.json \
            sources.json requested.config effective.config verification.json \
            --target 5ef6a8577ae24be27d8d81b3fe44a587d8491a16 \
            --title "Preserved source-built WR1200JS toolchain candidate" \
            --notes-file notes.md --prerelease --latest=false
