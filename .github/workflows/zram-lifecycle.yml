name: Service runtime state checks
on:
  push:
    paths:
      - 'overlay/padavan-4.4/patches/zram-service.diff'
      - 'tools/prepare-zram-lifecycle-check.py'
      - 'tools/prepare-zram-status-web.py'
      - 'tools/prepare-zram-status-check.py'
      - 'tools/check-zram-refresh.py'
      - 'tools/prepare-dns-process-status.py'
      - 'tools/prepare-mt76x2-file-read.py'
      - 'tools/check-mt76x2-file-read.py'
      - 'tools/prepare-usbip-status.py'
      - 'tools/check-usbip-status.py'
      - 'tools/prepare-usbip-status-check.py'
      - 'tools/usbip/**'
      - 'tools/eoip/**'
      - 'overlay/padavan-4.4/candidates/eoip/**'
      - 'tools/prepare-dns-process-check.py'
      - 'tools/check-dns-refresh.py'
      - 'tools/doh-instance-status.h'
      - 'tools/doh-instance-view.js'
      - 'tools/check-doh-instance-status.c'
      - 'tools/verify-strongswan-image.py'
      - 'tools/check-strongswan-image.py'
      - 'tools/strongswan/**'
      - 'overlay/padavan-4.4/ports/stubby/Advanced_Services_DoT.asp'
      - 'overlay/padavan-4.4/ports/doh/Advanced_Services_DoH.asp'
      - 'tools/retry-source-command.py'
      - 'tools/check-source-retry.py'
      - 'tools/collect-wr1200js-readiness.sh'
      - 'tools/check-readiness-dns-filter.py'
      - 'tools/check-sqm-config-policy.py'
      - 'tools/verify-wr1200js-config.py'
      - 'tools/prepare-vpn-interface-status.py'
      - 'tools/prepare-vpn-interface-check.py'
      - 'tools/vpn-status/**'
      - '.github/workflows/zram-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Check vendor file-read guard
        run: |
          python3 tools/check-mt76x2-file-read.py --output checks/mt76x2-read.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/mt76x2-read.c -o checks/mt76x2-read
          ASAN_OPTIONS=detect_leaks=1 checks/mt76x2-read
      - name: Check USB/IP runtime status integration
        run: |
          sh -n tools/usbip/firewall-policy.sh
          python3 tools/usbip/check-firewall.py
          sh -n tools/usbip/service.sh
          python3 tools/usbip/check-service.py
          sh -n tools/usbip/device-policy.sh
          python3 tools/usbip/check-device-policy.py
          sh -n tools/usbip/device-action.sh
          python3 tools/usbip/check-device-action.py
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/usbip/check-job-worker.c -o checks/usbip-job-worker
          ASAN_OPTIONS=detect_leaks=1 timeout 15s checks/usbip-job-worker
          python3 tools/usbip/check-http-actions.py --output checks/usbip-http-actions.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/usbip-http-actions.c -o checks/usbip-http-actions
          ASAN_OPTIONS=detect_leaks=1 checks/usbip-http-actions
          node tools/usbip/check-action-view.js
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-config.c -o checks/eoip-config
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-config
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-observation.c -o checks/eoip-observation
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-observation
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-netlink-query.c -o checks/eoip-query
          ASAN_OPTIONS=detect_leaks=1 timeout 10s checks/eoip-query
          gcc -std=gnu99 -Wall -Wextra -I tools/eoip -fsanitize=address,undefined tools/eoip/check-owned-create.c overlay/padavan-4.4/candidates/eoip/libnetlink.c -Wl,--wrap=rtnl_open,--wrap=rtnl_close,--wrap=rtnl_talk -o checks/eoip-owned-create
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-owned-create
          gcc -std=gnu99 -Wall -Wextra -I tools/eoip -fsanitize=address,undefined tools/eoip/check-owned-remove.c overlay/padavan-4.4/candidates/eoip/libnetlink.c -Wl,--wrap=rtnl_open,--wrap=rtnl_close,--wrap=rtnl_talk -o checks/eoip-owned-remove
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-owned-remove
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-runtime-state.c -o checks/eoip-runtime-state
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-runtime-state
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-lifecycle.c -o checks/eoip-lifecycle
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-lifecycle
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-configure.c -o checks/eoip-configure
          ASAN_OPTIONS=detect_leaks=1 timeout 15s checks/eoip-configure
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-controller.c -o checks/eoip-controller
          ASAN_OPTIONS=detect_leaks=1 timeout 15s checks/eoip-controller
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-worker.c -o checks/eoip-worker
          python3 tools/eoip/check-policy.py
          node tools/eoip/check-status-view.js
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-settings.c -o checks/eoip-settings
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-settings
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-stored.c -o checks/eoip-stored
          ASAN_OPTIONS=detect_leaks=1 checks/eoip-stored
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/check-status-runtime.c -o checks/eoip-status-runtime
          ASAN_OPTIONS=detect_leaks=1 timeout 10s checks/eoip-status-runtime
          ASAN_OPTIONS=detect_leaks=1 timeout 15s checks/eoip-worker
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/eoip/worker.c -o checks/eoip-worker-bin
          ASAN_OPTIONS=detect_leaks=1 timeout 15s checks/eoip-worker-bin status 0
          python3 tools/usbip/check-web.py
          python3 tools/usbip/check-inventory.py --output checks/usbip-inventory.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/usbip-inventory.c -o checks/usbip-inventory
          ASAN_OPTIONS=detect_leaks=1 checks/usbip-inventory
          python3 tools/usbip/prepare-firewall-check.py --output checks/usbip-firewall.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/usbip-firewall.c -o checks/usbip-firewall
          ASAN_OPTIONS=detect_leaks=1 checks/usbip-firewall
          python3 tools/check-usbip-status.py
          python3 tools/prepare-usbip-status-check.py --output checks/usbip-status.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/usbip-status.c -o checks/usbip-status
          ASAN_OPTIONS=detect_leaks=1 checks/usbip-status
      - name: Execute patched RC failure paths
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-source-retry.py
          python3 tools/check-strongswan-image.py
          sh -n tools/strongswan/strongswan-service.sh
          python3 tools/strongswan/check-service.py
          sh -n tools/collect-wr1200js-readiness.sh
          python3 tools/check-readiness-dns-filter.py
          python3 tools/check-sqm-config-policy.py
          python3 tools/prepare-zram-lifecycle-check.py --output checks/zram.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/zram.c -o checks/zram
          ASAN_OPTIONS=detect_leaks=1 checks/zram
          python3 tools/prepare-zram-status-check.py --output checks/zram-status.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/zram-status.c -o checks/zram-status
          ASAN_OPTIONS=detect_leaks=1 checks/zram-status
          python3 tools/check-zram-refresh.py
          python3 tools/prepare-dns-process-check.py --output checks/dns-process.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/dns-process.c -o checks/dns-process
          ASAN_OPTIONS=detect_leaks=1 checks/dns-process
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/check-doh-instance-status.c -o checks/doh-instances
          ASAN_OPTIONS=detect_leaks=1 checks/doh-instances
          python3 tools/check-dns-refresh.py
          python3 tools/prepare-vpn-interface-check.py --output checks/vpn-interface.c
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/vpn-interface.c -o checks/vpn-interface
          ASAN_OPTIONS=detect_leaks=1 checks/vpn-interface
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined tools/vpn-status/check-handshake-observation.c -o checks/handshake
          ASAN_OPTIONS=detect_leaks=1 checks/handshake
          gcc -std=gnu99 -Wall -Wextra -Werror tools/vpn-status/check-handshake-worker.c -o checks/handshake-worker
          timeout 15s checks/handshake-worker
          mkdir -p checks/wr-vpn
          cp tools/vpn-status/*.h checks/wr-vpn/
          cp tools/vpn-status/http-status.inc tools/vpn-status/check-http-status.c checks/
          gcc -std=gnu99 -Wall -Wextra -Werror -fsanitize=address,undefined checks/check-http-status.c -o checks/vpn-http
          ASAN_OPTIONS=detect_leaks=1 checks/vpn-http
          node tools/vpn-status/check-handshake-ui.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zram-lifecycle-check
          path: checks/*.c
