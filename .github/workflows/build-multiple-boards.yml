name: Build selected router firmware
run-name: TEST Padavan 4.4.198 — build ${{ github.run_number }}
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      boards:
        description: Router profiles to build
        type: choice
        options: [all-supported, wr1200js]
        default: wr1200js
      run_candidate_checks:
        description: Run additional isolated experimental compilations
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-multiple-boards.yml'
      - '.github/workflows/build-padavan-4.4-wr1200js.yml'
      - 'configs.build/wr1200js.config'
      - 'tools/tmp-upload/**'
      - 'tools/generate-router-guide.py'
      - 'tools/prepare-build-identity.py'
      - 'tools/check-router-guide.py'
      - 'docs/setup/**'
      - 'tools/connected-devices/check-built-radio-capacity.py'
      - 'tools/connected-devices/prepare-http.py'
      - 'tools/connected-devices/prepare-radio.py'
      - 'tools/connected-devices/prepare-background.py'
      - 'tools/connected-devices/prepare-ui.py'
      - 'tools/connected-devices/verify-ui-image.py'
      - 'tools/connected-devices/check-rssi-kernel.sh'
      - 'tools/connected-devices/check-rssi-kernel.c'
      - 'tools/connected-devices/rssi-*.h'
      - 'tools/connected-devices/rssi*.js'
      - 'tools/connected-devices/prepare-rssi-*.py'
      - 'tools/connected-devices/http-hook.inc'
      - 'tools/connected-devices/radio-hook.inc'
      - 'tools/connected-devices/networkmap.h'
      - 'tools/connected-devices/source-collector.h'
      - 'tools/connected-devices/snapshot-cache.h'
      - 'tools/connected-devices/snapshot-json.h'
      - 'tools/connected-devices/radio-table.h'
      - 'tools/connected-devices/radio-query.h'
      - 'tools/connected-devices/radio-merge.h'
      - 'tools/connected-devices/roaming-history.h'
      - 'tools/connected-devices/roaming-json.h'
      - 'tools/connected-devices/classify.js'
      - 'tools/connected-devices/refresh.js'
      - 'tools/connected-devices/homepage.js'
      - 'tools/connected-devices/homepage.css'
      - 'tools/connected-devices/roaming.js'
      - 'tools/connected-devices/roaming-view.js'
      - 'tools/connected-devices/boot.js'
      - 'overlay/padavan-4.4/ports/**'
      - 'overlay/padavan-4.4/scripts/**'
      - 'overlay/padavan-4.4/trunk/**'
      - 'overlay/padavan-4.4/patches/**'
      - 'sources.lock.json'
      - 'tools/verify-zram-image.py'
      - 'tools/verify-strongswan-image.py'
      - 'tools/prepare-zram-status-web.py'
      - 'tools/prepare-dns-process-status.py'
      - 'tools/prepare-mt76x2-file-read.py'
      - 'tools/prepare-usbip-status.py'
      - 'tools/usbip/prepare-firewall.py'
      - 'tools/usbip/service.sh'
      - 'tools/usbip/firewall-policy.sh'
      - 'tools/check-usbip-status.py'
      - 'tools/doh-instance-status.h'
      - 'tools/doh-instance-view.js'
      - 'tools/prepare-vpn-interface-status.py'
      - 'tools/prepare-vpn-handshake-status.py'
      - 'tools/vpn-status/**'
      - 'tools/verify-source-archive.py'
      - 'tools/retry-source-command.py'
      - 'tools/check-web-routes.py'
      - 'tools/check-web-routes-test.py'
      - 'tools/prepare-wifi-hwnat-mode.py'
      - 'tools/prepare-wifi-hwnat-ui.py'
      - 'tools/iot/check-capacity.py'
      - 'tools/iot/prepare-rc.py'
      - 'tools/iot/service-state.h'
      - 'tools/iot/service-transaction.h'
      - 'tools/iot/service-lock.h'
      - 'tools/iot/service-guard.*'
      - 'tools/iot/writer-journal.*'
      - 'tools/iot/restart-controller.inc'
      - 'tools/iot/dns-ready.h'
      - 'tools/iot/dns-config.h'
      - 'tools/iot/dnsmasq-files.h'
      - 'tools/iot/saved-bundle.h'
      - 'tools/iot/saved-file.h'
      - 'tools/iot/restore-file.h'
      - 'tools/iot/uts-state.h'
      - 'tools/iot/arp-state.h'
      - 'tools/iot/arp-restore.h'
      - 'tools/iot/profile*.h'
      - 'tools/iot/profile.c'
      - 'tools/iot/dhcp-write.c'
      - 'tools/iot/dhcp*.h'
      - 'tools/iot/bridge.*'
      - 'tools/iot/types.h'
      - 'tools/iot/subnet.h'
      - 'tools/verify-wr1200js-config.py'
      - 'tools/verify-rssi-image.py'
      - 'tools/prepare-zerotier-source.py'
      - 'tools/stage-firmware-download.py'
      - 'boards.json'
      - 'tools/board-catalog.py'
      - 'tools/collect-board-downloads.py'
      - 'tools/band-steering/prepare-main-bss.py'
      - 'tools/band-steering/prepare-wps-guards.py'
      - 'tools/band-steering/prepare-channel-stats.py'
      - 'tools/band-steering/prepare-off-ack.py'
      - 'tools/band-steering/prepare-uninitialized-off.py'
      - 'tools/band-steering/prepare-profile-integration.py'
      - 'tools/band-steering/prepare-wifi-lifecycle.py'
      - 'tools/band-steering/prepare-nvram-snapshot.py'
      - 'tools/band-steering/profile-policy.c'
      - 'tools/band-steering/profile-policy.h'
      - 'tools/band-steering/compile-rc-profile.sh'
      - 'tools/band-steering/prepare-child-reaper.py'
      - 'tools/band-steering/prepare-source-integration.py'
      - 'tools/band-steering/prepare-quiet-status-log.py'
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.boards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: boards
        env:
          BOARD_SELECTION: ${{ inputs.boards || 'wr1200js' }}
        run: python3 tools/board-catalog.py "$BOARD_SELECTION"
      - uses: actions/upload-artifact@v7
        with:
          name: selected-board-profiles
          path: selected-boards.json
  build:
    needs: select
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    uses: ./.github/workflows/build-padavan-4.4-wr1200js.yml
    with:
      run_candidate_checks: ${{ inputs.run_candidate_checks || false }}
  downloads:
    if: always() && needs.select.result == 'success'
    needs: [select, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: selected-board-profiles
          path: selection
      - uses: actions/download-artifact@v8
        with:
          pattern: padavan-linux-4.4.198-*
          path: board-artifacts
      - uses: actions/download-artifact@v8
        with:
          pattern: board-build-status-*
          path: board-status
      - name: Create common download index and checksums
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: python3 tools/collect-board-downloads.py
      - uses: actions/upload-artifact@v7
        with:
          name: padavan-4.4.198-router-downloads
          path: downloads/
          if-no-files-found: error
      - name: Require all selected firmware builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$BUILD_RESULT" = success
          python3 -c "import json; assert json.load(open('downloads/index.json'))['all_selected_images_built']"

  firmware-zip:
    needs: [select, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: padavan-linux-4.4.198-${{ matrix.board }}
          path: firmware-input
      - name: Prepare firmware and configuration only
        id: package
        env:
          BOARD_ID: ${{ matrix.board }}
        run: python3 tools/stage-firmware-download.py firmware-input firmware-download "$BOARD_ID"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: firmware-download/*
          if-no-files-found: error
          retention-days: 14
