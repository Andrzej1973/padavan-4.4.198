          if-no-files-found: ignore
          path: |
            privoxy-image-checks.json
            privoxy-target-config.json

      - name: Verify iPerf3 status UI and handler in image
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_IPERF3=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/iperf3/verify-image.py \
              padavan-4.4/trunk iperf3-image-checks.json
          fi

      - name: Upload iPerf3 image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iperf3-image-checks
          retention-days: 14
          if-no-files-found: ignore
          path: iperf3-image-checks.json

      - name: Verify SSH status UI and handler in image
        run: |
          python3 overlay/padavan-4.4/ports/ssh/verify-image.py \
            padavan-4.4/trunk ssh-image-checks.json \
            --source-page padavan-4.4/trunk/user/www/n56u_ribbon_fixed/Advanced_Services_Content.asp

      - name: Upload SSH image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ssh-image-checks
          retention-days: 14
          if-no-files-found: ignore
          path: ssh-image-checks.json

      - name: Verify discovery and KMS status in final ROMFS
        run: python3 tools/verify-discovery-status-image.py padavan-4.4/trunk/romfs

      - name: Verify DoH image packaging and ELF dependencies
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_DOH=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/doh/verify-image.py \
              padavan-4.4/trunk doh-image-checks.json
          fi

      - name: Upload DoH image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: doh-image-checks
          retention-days: 14
          if-no-files-found: ignore
          path: doh-image-checks.json

      - name: Verify StrongSwan packaged commands and dependency files
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SSWAN=y$' configs.build/wr1200js.config; then
            python3 tools/verify-strongswan-image.py padavan-4.4/trunk strongswan-image-checks.json
          fi

      - name: Upload StrongSwan image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strongswan-image-checks
          retention-days: 14
          if-no-files-found: ignore
          path: strongswan-image-checks.json

      - name: Upload IMQ patch rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: imq-patch-rejects
          retention-days: 14
          if-no-files-found: ignore
          path: imq-patch-rejects.txt

      - name: Verify RSSI Kick image controls and driver commands
