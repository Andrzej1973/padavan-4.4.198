name: Padavan Linux 4.4.198 WR1200JS
run-name: "WR1200JS Linux 4.4.198 build"

on:
  workflow_call:
    inputs:
      run_candidate_checks:
        description: Compile isolated experimental candidates after firmware verification
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-wr1200js:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache-wr1200js
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 2G
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6

      - name: Check WebUI route verifier regressions before compilation
        run: python3 tools/check-web-routes-test.py

      - name: Check unified service navigation image gate before compilation
        run: python3 tools/services-nav/check-verifier.py

      - name: Check ZeroTier status semantics before compilation
        run: python3 tools/check-zerotier-state.py --cc gcc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf automake autopoint cmake bison build-essential flex \
            gawk gettext git gperf libtool libtool-bin pkg-config fakeroot \
            kmod cpio texinfo help2man libncurses5-dev zlib1g-dev \
            libsqlite3-dev gcc-multilib curl dos2unix unzip wget xxd \
            libltdl-dev libgmp-dev libmpfr-dev libarchive-tools libblkid-dev \
            python3-docutils ccache

      - name: Check discovery status generator before firmware compilation
        run: python3 tools/check-discovery-status.py --output "$RUNNER_TEMP/wr1200js-discovery-fixture"

      - name: Check EoIP selected and excluded image gates before compilation
        run: python3 tools/eoip/check-image.py

      - name: Check exact-image BusyBox service map before firmware compilation
        run: python3 tools/check-target-busybox-map.py

      - name: Check QoS tc packaging selections before firmware compilation
        run: python3 tools/check-qos-packaging.py

      - name: Restore compiler cache
        id: compiler_cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: wr1200js-ccache-v1-${{ runner.os }}-uclibc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wr1200js-ccache-v1-${{ runner.os }}-uclibc-

      - name: Configure compiler cache
        run: |
          ccache --version
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Fetch pinned Padavan 4.4.198 source
        env:
          PADAVAN_COMMIT: c25283e915a2a00a763774dd255b14aff997285e
        run: |
          git init padavan-4.4
          git -C padavan-4.4 remote add origin https://github.com/vipshmily/padavan-4.4.git
          python3 tools/retry-source-command.py git -C padavan-4.4 fetch --depth=1 origin "$PADAVAN_COMMIT"
          python3 tools/retry-source-command.py git -C padavan-4.4 checkout --detach FETCH_HEAD
          test "$(git -C padavan-4.4 rev-parse HEAD)" = "$PADAVAN_COMMIT"

      - name: Fetch pinned AmneziaWG module source
        env:
          AMNEZIA_SOURCE_COMMIT: d2c5846299949c57a4e867284069900b561dd2a4
        run: |
          git init amnezia-source
          git -C amnezia-source remote add origin https://github.com/nilabsent/padavan-ng.git
          git -C amnezia-source config remote.origin.promisor true
          git -C amnezia-source config remote.origin.partialclonefilter blob:none
          git -C amnezia-source sparse-checkout init --cone
          git -C amnezia-source sparse-checkout set trunk/linux-3.4.x/net/amneziawg trunk/libs/libssl/3.5 trunk/libs/libcurl trunk/libs/libngtcp2 trunk/libs/libnghttp3 trunk/libs/libnghttp2 trunk/user/www/logo trunk/user/dnsmasq
          python3 tools/retry-source-command.py git -C amnezia-source fetch --filter=blob:none --depth=1 origin "$AMNEZIA_SOURCE_COMMIT"
          python3 tools/retry-source-command.py git -C amnezia-source checkout --detach FETCH_HEAD
          test "$(git -C amnezia-source rev-parse HEAD)" = "$AMNEZIA_SOURCE_COMMIT"
          test -s amnezia-source/trunk/user/www/logo/padavan.png
          test "$(git -C amnezia-source hash-object trunk/user/www/logo/padavan.png)" = ec7b6bcd9e27c41fd564832e860791a568587e20

      - name: Apply WR1200JS board port
        run: |
          python3 tools/prepare-mt76x2-file-read.py padavan-4.4
          python3 tools/prepare-mwan-shell.py padavan-4.4
          python3 tools/prepare-build-identity.py padavan-4.4 \
            --number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          patch --batch --forward -p1 -d padavan-4.4 \
            < overlay/padavan-4.4/patches/zram-service.diff
          # Runtime WAN role override: lets rc move the WAN role to another
          # external socket while the board's original socket stays isolated.
          patch --batch --forward -p1 -d padavan-4.4 \
            < overlay/padavan-4.4/patches/wan-port-runtime.diff
          python3 tools/wan-port/verify-runtime-patch.py padavan-4.4
          # Wire rc to the override: wan_src_phy names the WAN socket, the board
          # socket stays isolated, tagged sockets are refused.
          python3 overlay/padavan-4.4/scripts/integrate-wan-port.py padavan-4.4
          python3 tools/wan-port/verify-service-integration.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/integrate-vpn-profiles.py padavan-4.4
          python3 tools/vpn-profiles/prepare-storage-permissions.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/allow-vpn-management.py padavan-4.4
          python3 tools/wan-port/prepare-web.py padavan-4.4
          node tools/wan-port/check-web.js padavan-4.4
          python3 overlay/padavan-4.4/scripts/fix-web-event-masks.py padavan-4.4
          python3 tools/prepare-zram-status-web.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-json-route.py padavan-4.4
          mkdir -p padavan-4.4/trunk/libs/libqrencode
          cp overlay/padavan-4.4/trunk/libs/libqrencode/Makefile \
            padavan-4.4/trunk/libs/libqrencode/Makefile
          python3 overlay/padavan-4.4/scripts/add-qrencode.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-udpxy-selector.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/prepare-ttyd-optional.py padavan-4.4
          mkdir -p padavan-4.4/trunk/user/ndisc6
          cp overlay/padavan-4.4/trunk/user/ndisc6/Makefile \
            padavan-4.4/trunk/user/ndisc6/Makefile
          python3 overlay/padavan-4.4/scripts/add-ndisc6.py padavan-4.4
          mkdir -p padavan-4.4/trunk/libs/libudev padavan-4.4/trunk/user/usbip
          cp overlay/padavan-4.4/trunk/libs/libudev/Makefile \
            padavan-4.4/trunk/libs/libudev/Makefile
          cp overlay/padavan-4.4/trunk/user/usbip/Makefile \
            padavan-4.4/trunk/user/usbip/Makefile
          cp overlay/padavan-4.4/trunk/linux-4.4.x/tools/usb/usbip/src/usbip_network.{c,h} \
            padavan-4.4/trunk/linux-4.4.x/tools/usb/usbip/src/
          python3 overlay/padavan-4.4/scripts/add-usbip.py padavan-4.4
          python3 tools/prepare-usbip-status.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-firewall.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-lifecycle.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-web.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-inventory.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-http-actions.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-action-view.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-export-settings.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/usbip/prepare-settings-view.py padavan-4.4 --config configs.build/wr1200js.config
          cp tools/usbip/service.sh tools/usbip/firewall-policy.sh padavan-4.4/trunk/user/usbip/
          cp tools/usbip/device-policy.sh tools/usbip/device-action.sh padavan-4.4/trunk/user/usbip/
          cp tools/usbip/restore.sh padavan-4.4/trunk/user/usbip/
          cp tools/usbip/export-table.c tools/usbip/export-store.h tools/usbip/export-codec.h tools/usbip/export-rules.h padavan-4.4/trunk/user/usbip/
          cp overlay/padavan-4.4/trunk/linux-4.4.x/tools/usb/usbip/libsrc/usbip_common.c \
            padavan-4.4/trunk/linux-4.4.x/tools/usb/usbip/libsrc/usbip_common.c
          python3 overlay/padavan-4.4/scripts/add-amneziawg.py padavan-4.4 amnezia-source
          python3 overlay/padavan-4.4/scripts/prepare-openssl35.py padavan-4.4 amnezia-source
          python3 overlay/padavan-4.4/scripts/prepare-quic.py padavan-4.4 amnezia-source
          python3 overlay/padavan-4.4/scripts/add-lua-selector.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-fs-tools-selector.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-tproxy-selector.py padavan-4.4
          python3 overlay/padavan-4.4/ports/sqm/prepare-lifecycle.py padavan-4.4
          python3 overlay/padavan-4.4/ports/sqm/prepare-web.py padavan-4.4
          python3 overlay/padavan-4.4/ports/sqm/prepare-packaging.py padavan-4.4
          python3 overlay/padavan-4.4/ports/qos/prepare-packaging.py padavan-4.4
          sh -n padavan-4.4/trunk/user/sqm-qos/scripts/run.sh
          python3 overlay/padavan-4.4/scripts/add-amneziawg-nvram.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-lifecycle.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-firewall.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-web-capabilities.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-web-actions.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-web-assets.py padavan-4.4
          python3 tools/prepare-service-toggle-colors.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-vpn-labels.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-amneziawg-pages.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/localize-wireguard-page.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/localize-inherited-dicts.py padavan-4.4
          # The AmneziaWG step above replaces vpncli.asp wholesale, so the
          # stored-profile table must be injected after every page copy.
          python3 tools/vpn-profiles/prepare-web.py padavan-4.4
          python3 tools/vpn-profiles/check-web.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-wr1200js-footer-credit.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/localize-rssi-thresholds.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/preserve-ddns-defaults.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/add-logo-ddns-selectors.py padavan-4.4 amnezia-source
          python3 overlay/padavan-4.4/scripts/integrate-eoip.py padavan-4.4
          python3 tools/eoip/prepare-defaults.py padavan-4.4 --config configs.build/wr1200js.config
          python3 overlay/padavan-4.4/scripts/integrate-dnsmasq-regex.py padavan-4.4 amnezia-source
          python3 overlay/padavan-4.4/scripts/integrate-wpad.py padavan-4.4
          python3 overlay/padavan-4.4/scripts/harden-zerotier-lifecycle.py padavan-4.4
          python3 overlay/padavan-4.4/ports/zerotier/prepare-ui-lifecycle.py padavan-4.4
          python3 overlay/padavan-4.4/ports/zerotier/prepare-build.py padavan-4.4 \
            --prepare-script tools/prepare-zerotier-source.py
          sh -n padavan-4.4/trunk/user/zerotier/zerotier.sh
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_STUBBY=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/stubby/integrate-build.py padavan-4.4 \
              --config configs.build/wr1200js.config
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_PRIVOXY=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/privoxy/integrate-port.py padavan-4.4 \
              --config configs.build/wr1200js.config
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_DOH=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/doh/integrate-port.py padavan-4.4 \
              --config configs.build/wr1200js.config
          fi
          python3 tools/prepare-dns-process-status.py padavan-4.4
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_PRIVOXY=y$' configs.build/wr1200js.config; then
            python3 tools/prepare-privoxy-status.py padavan-4.4
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_IPERF3=y$' configs.build/wr1200js.config; then
            python3 tools/prepare-iperf3-status.py padavan-4.4
          fi
          python3 tools/prepare-ssh-status.py padavan-4.4
          python3 tools/prepare-cron-status.py padavan-4.4
          python3 tools/prepare-discovery-status.py padavan-4.4
          python3 tools/prepare-vpn-interface-status.py padavan-4.4
          cp overlay/padavan-4.4/trunk/user/rp-l2tp/Makefile \
            padavan-4.4/trunk/user/rp-l2tp/Makefile
          cp overlay/padavan-4.4/trunk/user/ntfs-3g/Makefile \
            padavan-4.4/trunk/user/ntfs-3g/Makefile
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/board.h \
            padavan-4.4/trunk/configs/boards/WR1200JS/board.h
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/partitions.config \
            padavan-4.4/trunk/configs/boards/WR1200JS/partitions.config
          # Keep rejected hunks for the vendor-kernel adaptation if a
          # third-party IMQ backport does not match this pinned tree.
          if ! patch --batch --forward -p1 \
              -d padavan-4.4/trunk/linux-4.4.x \
              < overlay/padavan-4.4/patches/linux-4.4-imq.diff; then
            python3 overlay/padavan-4.4/scripts/apply-imq-vendor.py
          fi
          # Merge only USB/PHY configuration from the one-USB reference board,
          # retaining the complete WR1200JS radio and board-specific kernel config.
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path("padavan-4.4/trunk/configs/boards/K2P-USB/kernel-4.4.x.config").read_text()
          target_path = Path("padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config")
          target = target_path.read_text()
          source_values = {}
          for line in source.splitlines():
              match = re.match(r"^(?:# )?(CONFIG_[A-Za-z0-9_]+)(?:=(.*)| is not set)$", line)
              if match and (match.group(1).startswith("CONFIG_USB")
                            or match.group(1) == "CONFIG_PHY_MTK_TPHY"
                            or match.group(1) in {
                                "CONFIG_SCSI", "CONFIG_SCSI_DMA",
                                "CONFIG_SCSI_PROC_FS", "CONFIG_BLK_DEV_SD",
                            }):
                  source_values[match.group(1)] = line
          keys = set(source_values)
          merged = []
          seen = set()
          for line in target.splitlines():
              match = re.match(r"^(?:# )?(CONFIG_[A-Za-z0-9_]+)", line)
              if match and match.group(1) in keys:
                  key = match.group(1)
                  merged.append(source_values.get(key, "# " + key + " is not set"))
                  seen.add(key)
              else:
                  merged.append(line)
          for key in sorted(keys - seen):
              merged.append(source_values[key])
          for key in ("CONFIG_USB_XHCI_MTK", "CONFIG_USB_XHCI_HCD"):
              merged = [line for line in merged
                        if not line.startswith(key + "=")
                        and line != "# " + key + " is not set"]
              merged.append("# " + key + " is not set")
          target_path.write_text("\n".join(merged) + "\n")
          PY
          grep -q '^CONFIG_RALINK_BUILTIN_DTB_NAME="wr1200js"$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_FIRST_IF_MT7603E=y$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_RT_SECOND_IF_MT7612E=y$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_RT_FIRST_IF_RF_OFFSET=0x0$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_RT_SECOND_IF_RF_OFFSET=0x8000$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          python3 - <<'PY'
          from pathlib import Path
          path = Path("padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config")
          lines = path.read_text().splitlines()
          values = {
              "CONFIG_IP_SET": "m",
              "CONFIG_IP_SET_BITMAP_IP": "m",
              "CONFIG_IP_SET_BITMAP_PORT": "m",
              "CONFIG_IP_SET_HASH_IP": "m",
              "CONFIG_IP_SET_HASH_IPPORT": "m",
              "CONFIG_IP_SET_HASH_IPPORTIP": "m",
              "CONFIG_IP_SET_HASH_IPPORTNET": "m",
              "CONFIG_IP_SET_HASH_NET": "m",
              "CONFIG_IP_SET_HASH_NETPORT": "m",
              "CONFIG_IFB": "m",
              "CONFIG_IMQ": "m",
              "CONFIG_IMQ_BEHAVIOR_AB": "y",
              "CONFIG_NETFILTER_XT_TARGET_IMQ": "m",
          }
          if "CONFIG_FIRMWARE_INCLUDE_ZRAM=y" in Path("configs.build/wr1200js.config").read_text().splitlines():
              values.update({"CONFIG_ZSMALLOC": "y", "CONFIG_ZRAM": "m"})
          if "CONFIG_FIRMWARE_INCLUDE_USBIP=y" in Path("configs.build/wr1200js.config").read_text().splitlines():
              values.update({"CONFIG_USBIP_CORE": "m", "CONFIG_USBIP_HOST": "m",
                             "CONFIG_USBIP_VHCI_HCD": "m"})
          if "CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y" in Path("configs.build/wr1200js.config").read_text().splitlines():
              values.update({"CONFIG_AMNEZIAWG": "m"})
          for key, value in values.items():
              lines = [line for line in lines if not line.startswith(key + "=")
                       and line != "# " + key + " is not set"]
              lines.append(key + "=" + value)
          path.write_text("\n".join(lines) + "\n")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          config = Path("padavan-4.4/trunk/configs/templates/WR1200JS.config")
          # The corresponding source hook is applied after toolchain extraction.
          baseline = config.read_text()
          if 'CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING' in baseline:
              raise SystemExit('Unexpected existing WR steering template selector')
          config.write_text(baseline + '\n# CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING is not set\n')
          source = Path("configs.build/wr1200js.config").read_text().splitlines()
          text = config.read_text().splitlines()
          desired = {}
          enabled_requests = set()
          for line in source:
              match = re.match(r"^(#\s*)?(CONFIG_FIRMWARE_[A-Za-z0-9_]+)=(.*)$", line)
              if match:
                  key, value = match.group(2), match.group(3)
                  value = "n" if match.group(1) else value
                  desired[key] = value
                  if value == "y":
                      enabled_requests.add(key)
          # Aliases verified against the pinned target Makefiles.
          aliases = {
              "CONFIG_FIRMWARE_INCLUDE_SHORTCUT_FE": "CONFIG_FIRMWARE_INCLUDE_SFE",
          }
          for old, new in aliases.items():
              if old in desired:
                  desired[new] = desired[old]
          ss_modes = ("CONFIG_FIRMWARE_INCLUDE_SSREDIR",
                      "CONFIG_FIRMWARE_INCLUDE_SSLOCAL")
          if any(key in desired for key in ss_modes):
              desired["CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS"] = (
                  "y" if any(desired.get(key) == "y" for key in ss_modes) else "n")
          # Do not inherit optional services or languages from the target board.
          for line in text:
              match = re.match(r"^(?:#\s*)?(CONFIG_FIRMWARE_INCLUDE_[A-Za-z0-9_]+)=", line)
              if match:
                  desired.setdefault(match.group(1), "n")
          # Keep the destination fork's Ralink/MT7621 board identity.
          desired.pop("CONFIG_FIRMWARE_PRODUCT_ID", None)
          copied = set()
          for index, line in enumerate(text):
              match = re.match(r"^(?:#\s*)?(CONFIG_FIRMWARE_[A-Za-z0-9_]+)(?:=| is not set$)", line)
              if match and match.group(1) in desired:
                  key = match.group(1)
                  value = desired[key]
                  text[index] = ("# " + key + " is not set" if value in ("n", "\"n\"")
                                 else key + "=" + value)
                  copied.add(key)
          mapped_requests = set(aliases) | set(ss_modes)
          missing = sorted(enabled_requests - copied - mapped_requests)
          Path("unsupported-firmware-options.txt").write_text(
              "\n".join(missing) + ("\n" if missing else "")
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"Copied {len(copied)} matching firmware options. "
                            f"{len(missing)} user options need separate ports.\n")
              if missing:
                  summary.write("\nOptions without a matching target selector:\n")
                  summary.write("\n".join(f"- {key}" for key in missing) + "\n")
          config.write_text("\n".join(text) + "\n")
          PY
          grep -q '^CONFIG_IP_SET=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_IFB=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_IP_SET_HASH_NET=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_IP_SET_HASH_NETPORT=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_USB_SUPPORT=y$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^# CONFIG_USB_XHCI_MTK is not set$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_USB_EHCI_HCD=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_USB_STORAGE=m$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '^CONFIG_BLK_DEV_SD=y$' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config
          grep -q '{ "sqm_enable", "0" }' padavan-4.4/trunk/user/shared/defaults.c
          mkdir -p padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink
          cp -a overlay/padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/wr1200js.dts \
            padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/
          cp -a overlay/padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/mt7621-spi-16m-wr1200js-layout.dtsi \
            padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/
          grep -q 'mt7621-spi-16m-wr1200js-layout.dtsi' \
            padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/wr1200js.dts \
            || sed -i 's/#include "mt7621-spi-16m-layout.dtsi"/#include "mt7621-spi-16m-wr1200js-layout.dtsi"/' \
              padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/wr1200js.dts
          grep -q 'firmware.*0xf70000' \
            padavan-4.4/trunk/linux-4.4.x/arch/mips/boot/dts/ralink/mt7621-spi-16m-wr1200js-layout.dtsi
          grep -q 'WR1200JS' padavan-4.4/trunk/configs/boards/WR1200JS/board.mk
          grep -q 'CONFIG_RALINK_BUILTIN_DTB_NAME="wr1200js"' \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config

      - name: Exclude legacy VPN userspace from WR1200JS
        run: |
          python3 tools/prepare-target-busybox.py padavan-4.4
          python3 tools/check-wg-protocol-selection.py
          python3 tools/check-wg-setconf-result.py
          python3 tools/prepare-wg-tool-separation.py padavan-4.4
          python3 tools/prepare-wr-vpn-pruning.py padavan-4.4
          python3 tools/prepare-wg-protocol-web.py padavan-4.4
          python3 tools/check-wr-vpn-pruning.py padavan-4.4
          python3 tools/prepare-vpn-qr.py padavan-4.4
          python3 tools/check-wg-server-ui.py padavan-4.4
          node tools/vpn-status/check-qr-export.js
          python3 tools/vpn-profiles/prepare-package.py padavan-4.4 --config configs.build/wr1200js.config

      - name: Download the Linux 4.4 uClibc toolchain
        run: |
          mkdir -p padavan-4.4/toolchain/toolchain-mipsel
          curl --fail --location --retry 5 \
            --output padavan-4.4/toolchain-mipsel.tar.xz \
            https://github.com/vipshmily/padavan-4.4/releases/download/toolchain/mipsel-linux-uclibc.tar.xz
          sha256sum padavan-4.4/toolchain-mipsel.tar.xz | tee toolchain-sha256.txt
          python3 tools/verify-source-archive.py mipsel-linux-uclibc-toolchain padavan-4.4/toolchain-mipsel.tar.xz
          tar -xJf padavan-4.4/toolchain-mipsel.tar.xz \
            -C padavan-4.4/toolchain/toolchain-mipsel

      - name: Prepare requested WR Band Steering integration
        id: steering_prepare
        run: |
          set -euo pipefail
          enabled=n
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING=y' configs.build/wr1200js.config; then
            compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
            test -n "$compiler"
            python3 tools/band-steering/prepare-source-integration.py padavan-4.4 \
              --config configs.build/wr1200js.config --compiler "$compiler"
            enabled=y
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Prepare WR RSSI driver observation and read-only query
        run: |
          set -euo pipefail
          python3 tools/connected-devices/prepare-rssi-adapter.py padavan-4.4
          python3 tools/connected-devices/prepare-rssi-identity.py padavan-4.4
          python3 tools/connected-devices/prepare-rssi-decision.py padavan-4.4
          python3 tools/connected-devices/prepare-rssi-removal.py padavan-4.4
          python3 tools/connected-devices/prepare-rssi-query.py padavan-4.4

      - name: Keep wireless offload manually selectable with LAN-only factory default
        run: |
          python3 tools/prepare-wifi-hwnat-mode.py padavan-4.4 --lan-only-default
          python3 tools/prepare-wifi-hwnat-ui.py padavan-4.4
          grep -q '{ "hw_nat_mode", "2" }' padavan-4.4/trunk/user/shared/defaults.c

      - name: Prepare local Wi-Fi QR previews when QR support is selected
        run: |
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_QRENCODE=y' configs.build/wr1200js.config; then
            node tools/check-wifi-qr-payload.js
            node tools/check-wifi-qr-renderer.js
            node tools/check-wifi-qr-preview.js
            python3 tools/prepare-wifi-qr-ui.py padavan-4.4
          fi

      - name: Prepare guarded firmware upload tmpfs action
        run: |
          python3 tools/tmp-upload/check-tmp-upload-preparation.py padavan-4.4
          python3 tools/tmp-upload/prepare-tmp-upload.py padavan-4.4
          python3 tools/tmp-upload/check-tmp-image-verifier.py padavan-4.4

      - name: Prepare default-off shared Wi-Fi HTTP handling
        run: |
          node tools/shared-wifi/check-ui.js
          python3 tools/shared-wifi/prepare-ui.py padavan-4.4
          # IoT integration is deferred from this device test firmware.
          python3 tools/prepare-shared-wifi.py padavan-4.4
          python3 tools/connected-devices/prepare-http.py padavan-4.4
          python3 tools/connected-devices/prepare-radio.py padavan-4.4
          python3 tools/connected-devices/prepare-background.py padavan-4.4
          python3 tools/vpn-status/check-legacy-ui.py \
            overlay/padavan-4.4/trunk/user/www/n56u_ribbon_fixed/vpncli.asp
          python3 tools/prepare-vpn-handshake-status.py padavan-4.4
          python3 tools/prepare-shadowsocks-status.py padavan-4.4
          python3 tools/prepare-shadowsocks-localization.py padavan-4.4
          node tools/check-shadowsocks-status.js \
            padavan-4.4/trunk/user/www/n56u_ribbon_fixed/Shadowsocks.asp
          python3 tools/eoip/prepare-status.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/eoip/prepare-settings.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/eoip/prepare-page.py padavan-4.4 --config configs.build/wr1200js.config
          python3 tools/services-nav/prepare-unified-nav.py padavan-4.4 \
            --config configs.build/wr1200js.config
          python3 tools/connected-devices/prepare-ui.py padavan-4.4
          python3 tools/shared-wifi/check-source-integration.py padavan-4.4
          python3 tools/shared-wifi/prepare-http-check.py padavan-4.4 --output shared-wifi-http-check.c
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            -Itools/shared-wifi shared-wifi-http-check.c -o shared-wifi-http-check
          ./shared-wifi-http-check

      - name: Apply requested userspace optimization policy
        run: |
          python3 overlay/padavan-4.4/scripts/set-userspace-performance.py \
            padavan-4.4/trunk configs.build/wr1200js.config
          grep -E '^(UOPT|LOPT)[[:space:]]*=' padavan-4.4/trunk/config.arch

      - name: Configure optional NFS kernel support
        run: |
          python3 overlay/padavan-4.4/scripts/set-nfs-kernel-options.py \
            configs.build/wr1200js.config \
            padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config

      - name: Build WR1200JS firmware
        id: firmware_build
        run: |
          trap 'printf "Firmware build verification failed: %s\n" "$BASH_COMMAND" >&2' ERR
          cd padavan-4.4
          test ! -e trunk/user/rc/wr-iot-profile.c
          test ! -d trunk/user/rc/wr-iot
          make WR1200JS TOOLCHAIN=mipsel-linux-uclibc CONFIG_CCACHE=y
          grep -qx 'CONFIG_CCACHE=y' trunk/.config
          test "$(readlink toolchain/toolchain-mipsel/lib/ccache/mipsel-linux-uclibc-gcc)" = /usr/bin/ccache
          compiler="$(find "$PWD/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          export PATH="$(dirname "$compiler"):$PATH"
          for radio in mt76x2 mt76x3; do
            module="trunk/linux-4.4.x/drivers/net/wireless/mediatek/${radio}_ap/${radio}_ap.ko"
            test -s "$module"
            "${compiler%gcc}nm" "$module" | grep -E '[[:space:]]wr_rssi_delete_entry$'
            grep -q 'case WR_RSSI_QUERY_OID:' "trunk/linux-4.4.x/drivers/net/wireless/mediatek/$radio/ap/ap_cfg.c"
          done
          grep -a -F -q 'wr_rssi.json' trunk/romfs/usr/sbin/httpd
          bash ../tools/connected-devices/check-rssi-kernel.sh trunk/linux-4.4.x "$compiler" ../rssi-kernel-probe
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING=y' trunk/.config; then
            grep -qx 'CONFIG_MT7603E_BAND_STEERING_7603=y' trunk/linux-4.4.x/.config
            grep -qx 'CONFIG_RT_BAND_STEERING=y' trunk/linux-4.4.x/.config
            for binary in wr-band-steering wr-band-steering-ctl; do
              test -x "trunk/romfs/usr/sbin/$binary"
              readelf -h "trunk/romfs/usr/sbin/$binary" | grep -q 'Machine:.*MIPS'
            done
            grep -a -q '/usr/sbin/wr-band-steering' trunk/romfs/sbin/rc
            grep -a -q 'wr_bs_enable' trunk/romfs/lib/libshared.so
            grep -a -F -q 'Enabled module, requested offload [WAN]<->[LAN]' trunk/romfs/sbin/rc
            grep -a -F -q 'Owned daemon exited: clean=' trunk/romfs/sbin/rc
            grep -a -F -q 'Wi-Fi apply left steering disabled: requested=' trunk/romfs/sbin/rc
            grep -a -F -q 'Apply failed: state=' trunk/romfs/sbin/rc
            grep -a -F -q 'Boot profile write failed; wireless modules not loaded' trunk/romfs/sbin/rc
            grep -a -F -q 'Shutdown OFF acknowledgement unverified' trunk/romfs/sbin/rc
            python3 ../tools/band-steering/verify-package-closure.py trunk/romfs trunk/romfs \
              --production-image --output ../firmware-steering-closure.json
            python3 ../tools/band-steering/verify-package-closure.py trunk/romfs trunk/romfs \
              --production-image --binary sbin/rc --output ../firmware-steering-rc-closure.json
            python3 ../tools/band-steering/verify-status-image.py trunk/romfs \
              --output ../firmware-steering-status-image.json
          else
            test ! -e trunk/romfs/usr/sbin/wr-band-steering
            test ! -e trunk/romfs/usr/sbin/wr-band-steering-ctl
          fi
          python3 ../tools/shared-wifi/verify-ui-image.py trunk/romfs
          python3 ../tools/connected-devices/verify-ui-image.py trunk/romfs
          python3 ../tools/vpn-status/verify-image.py trunk/romfs
          python3 ../tools/verify-shadowsocks-status-image.py trunk/romfs
          test -x trunk/romfs/usr/sbin/httpd
          readelf -h trunk/romfs/usr/sbin/httpd | grep -q 'Machine:.*MIPS'
          grep -a -F -q 'Invalid shared Wi-Fi request. No settings were saved.' trunk/romfs/usr/sbin/httpd
          grep -a -F -q 'Shared Wi-Fi changes require coordinated apply.' trunk/romfs/usr/sbin/httpd
          grep -a -F -q 'wr_wifi_shared' trunk/romfs/lib/libshared.so
          test ! -e trunk/romfs/usr/sbin/udpxy
          test ! -e trunk/romfs/usr/bin/msd_lite
          test ! -e trunk/romfs/etc_ro/msd_lite.conf
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_TTYD=y$' trunk/.config; then
            test -x trunk/romfs/usr/bin/ttyd
            test -x trunk/romfs/usr/bin/ttyd.sh
            readelf -h trunk/romfs/usr/bin/ttyd | grep -q 'Machine:.*MIPS'
            grep -q 'ttyd -- -W -i br0' trunk/romfs/usr/bin/ttyd.sh
          fi
          python3 ../overlay/padavan-4.4/scripts/set-nfs-kernel-options.py \
            ../configs.build/wr1200js.config trunk/linux-4.4.x/.config --verify
          set -x
          for option in QOS IMQ IFB IPSET XFRM; do
            grep -q "^CONFIG_FIRMWARE_INCLUDE_${option}=y$" trunk/.config
          done
          for option in OPENVPN RPL2TP EOIP SSWAN; do
            ! grep -Eq "^CONFIG_FIRMWARE_INCLUDE_${option}=(y|m)$" trunk/.config
          done
          for path in usr/sbin/pptpd usr/sbin/xl2tpd usr/sbin/openvpn usr/lib/pppd/pptp.so usr/lib/pppd/pppol2tp.so; do
            test ! -e "trunk/romfs/$path"
          done
          grep -q '^CONFIG_FIRMWARE_ENABLE_USB=y$' trunk/.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_NDISC6_RDISC6=y$' trunk/.config; then
            grep -q '^CONFIG_FIRMWARE_ENABLE_IPV6=y$' trunk/.config
            for tool in ndisc6 rdisc6; do
              test -x "trunk/romfs/usr/bin/$tool"
              readelf -h "trunk/romfs/usr/bin/$tool" | grep -q 'Machine:.*MIPS'
            done
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_QRENCODE=y$' trunk/.config; then
            test -x trunk/romfs/usr/bin/qrencode
            readelf -h trunk/romfs/usr/bin/qrencode | grep -q 'Machine:.*MIPS'
            python3 ../tools/verify-wifi-qr-image.py trunk/romfs \
              --output ../wifi-qr-image.json
          fi
          grep -q '^CONFIG_FIRMWARE_ENABLE_EXT4=y$' trunk/.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SSWAN=y$' ../configs.build/wr1200js.config; then
            grep -q '^CONFIG_FIRMWARE_INCLUDE_SSWAN=y$' trunk/.config
          else
            ! grep -Eq '^CONFIG_FIRMWARE_INCLUDE_SSWAN=(y|m)$' trunk/.config
            for binary in usr/sbin/ipsec usr/libexec/ipsec/charon usr/libexec/ipsec/starter usr/libexec/ipsec/stroke; do
              test ! -e "trunk/romfs/$binary"
            done
            test ! -e trunk/romfs/usr/lib/ipsec/libstrongswan.so.0
            test ! -e trunk/romfs/usr/lib/ipsec/libcharon.so.0
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SHADOWSOCKS=y$' trunk/.config; then
            for client in ss-local ss-redir; do
              test -x "trunk/romfs/usr/bin/$client"
              readelf -h "trunk/romfs/usr/bin/$client" | grep -q 'Machine:.*MIPS'
            done
          fi
          if ! grep -q '^CONFIG_FIRMWARE_INCLUDE_SSSERVER=y$' trunk/.config; then
            test ! -e trunk/romfs/usr/bin/ss-server
          fi
          grep -q '^CONFIG_FIRMWARE_INCLUDE_ZEROTIER=y$' trunk/.config
          for symbol in PPTP PPPOL2TP PPPOLAC L2TP L2TP_V3 NF_CONNTRACK_PPTP NF_NAT_PPTP NETFILTER_XT_MATCH_L2TP; do
            ! grep -Eq "^CONFIG_${symbol}=(y|m)$" trunk/linux-4.4.x/.config
          done
          grep -Eq '^CONFIG_PPPOE=(y|m)$' trunk/linux-4.4.x/.config
          grep -q '^CONFIG_IMQ=m$' trunk/linux-4.4.x/.config
          grep -q '^CONFIG_NETFILTER_XT_TARGET_IMQ=m$' trunk/linux-4.4.x/.config
          grep -q '^CONFIG_IFB=m$' trunk/linux-4.4.x/.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_ZRAM=y$' trunk/.config; then
            grep -q '^CONFIG_ZRAM=m$' trunk/linux-4.4.x/.config
            grep -q '^CONFIG_ZSMALLOC=y$' trunk/linux-4.4.x/.config
            test -n "$(find trunk/romfs/lib/modules -name zram.ko -print -quit)"
            grep -q 'name="zram_enable"' trunk/romfs/www/Advanced_System_Content.asp
          fi
          grep -q '^CONFIG_IP_SET=m$' trunk/linux-4.4.x/.config
          grep -q '^CONFIG_USB_STORAGE=m$' trunk/linux-4.4.x/.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_USBIP=y$' trunk/.config; then
            grep -q '^CONFIG_HEXDUMP=y$' trunk/user/busybox/busybox-1.24.x/.config
            test -L trunk/romfs/usr/bin/hexdump
            for symbol in USBIP_CORE USBIP_HOST USBIP_VHCI_HCD; do
              grep -q "^CONFIG_$symbol=m$" trunk/linux-4.4.x/.config
            done
            for module in usbip-core usbip-host vhci-hcd; do
              test -n "$(find trunk/romfs/lib/modules -name "$module.ko" -print -quit)"
            done
            for tool in usbip usbipd; do
              test -x "trunk/romfs/sbin/$tool"
              readelf -h "trunk/romfs/sbin/$tool" | grep -q 'Machine:.*MIPS'
            done
            test -s trunk/romfs/lib/libudev.so.1
            grep -q 'wr_usbip_state' trunk/romfs/www/Advanced_Printer_others.asp
            grep -q '^WRUSBIPTitle=' trunk/romfs/www/EN.dict
            grep -q '^WRUSBIPTitle=' trunk/romfs/www/UK.dict
            grep -q '^WRUSBIPTitle=' trunk/romfs/www/RU.dict
            grep -a -q 'wr_usbip_state' trunk/romfs/usr/sbin/httpd
            test -x trunk/romfs/usr/sbin/wr-usbip
            grep -q 'name="usbip_enable"' trunk/romfs/www/Advanced_Printer_others.asp
            grep -q 'wrUSBIPInventoryRefresh' trunk/romfs/www/Advanced_Printer_others.asp
            grep -a -q 'wr_usbip_inventory' trunk/romfs/usr/sbin/httpd
            grep -a -q 'wr_usbip_action.cgi' trunk/romfs/usr/sbin/httpd
            grep -q 'wrUSBIPActionSubmit' trunk/romfs/www/Advanced_Printer_others.asp
            for dictionary in EN.dict UK.dict RU.dict; do
              grep -q '^WRUSBIPActionUnknown=' "trunk/romfs/www/$dictionary"
            done
            for dictionary in EN.dict UK.dict RU.dict; do
              grep -q '^WRUSBIPEnableNote=' "trunk/romfs/www/$dictionary"
            done
            test -r trunk/romfs/usr/libexec/wr-usbip/firewall-policy.sh
            cmp ../tools/usbip/service.sh trunk/romfs/usr/sbin/wr-usbip
            cmp ../tools/usbip/firewall-policy.sh trunk/romfs/usr/libexec/wr-usbip/firewall-policy.sh
            cmp ../tools/usbip/device-policy.sh trunk/romfs/usr/libexec/wr-usbip/device-policy.sh
            cmp ../tools/usbip/device-action.sh trunk/romfs/usr/libexec/wr-usbip/device-action.sh
            cmp ../tools/usbip/restore.sh trunk/romfs/usr/libexec/wr-usbip/restore.sh
            test -x trunk/romfs/usr/libexec/wr-usbip/export-table
            readelf -h trunk/romfs/usr/libexec/wr-usbip/export-table | grep -q 'Machine:.*MIPS'
            python3 ../overlay/padavan-4.4/scripts/verify-usbip-elf.py \
              trunk/romfs ../usbip-elf-dependencies.json
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y$' trunk/.config; then
            for page in vpncli.asp vpnsrv.asp; do
              test -s "trunk/romfs/www/$page"
              grep -q 'found_app_awg' "trunk/romfs/www/$page"
            done
            grep -q '^CONFIG_AMNEZIAWG=m$' trunk/linux-4.4.x/.config
            awg_module="$(find trunk/romfs/lib/modules -name amneziawg.ko -print -quit)"
            test -n "$awg_module"
            modinfo -F vermagic "$awg_module" | grep -q '^4\.4\.198'
            test -x trunk/romfs/usr/bin/awg
            grep -q 'name="vpnc_wg_protocol"' trunk/romfs/www/vpncli.asp
            grep -q 'name="vpns_wg_protocol"' trunk/romfs/www/vpnsrv.asp
            grep -aq 'vpnc_wg_protocol' trunk/romfs/usr/sbin/httpd
            grep -aq 'vpns_wg_protocol' trunk/romfs/usr/sbin/httpd
            grep -q '<% wr_vpn_profile_rows(); %>' trunk/romfs/www/vpncli.asp
            grep -q 'wr_vpn_action.cgi' trunk/romfs/www/vpncli.asp
            grep -aq 'wr_vpn_profile_rows' trunk/romfs/usr/sbin/httpd
            grep -aq 'wr_vpn_action.cgi' trunk/romfs/usr/sbin/httpd
            grep -q 'wr_vpn_create.cgi' trunk/romfs/www/vpncli.asp
            grep -aq 'wr_vpn_create.cgi' trunk/romfs/usr/sbin/httpd
            grep -aq 'wr_vpn_edit.cgi' trunk/romfs/usr/sbin/httpd
            grep -q 'wr_vpn_edit.cgi' trunk/romfs/www/vpncli.asp
            grep -q 'id="wr_vpn_editor"' trunk/romfs/www/vpncli.asp
            grep -q 'id="wr_vpn_refresh"' trunk/romfs/www/vpncli.asp
            for dictionary in EN.dict UK.dict RU.dict; do
              grep -q '^WRVPN_EDIT_HELP=' "trunk/romfs/www/$dictionary"
              grep -q '^WRVPN_STORAGE_HELP=' "trunk/romfs/www/$dictionary"
            done
            grep -aq 'wr_vpn_profile_observation' trunk/romfs/usr/sbin/httpd
            python3 ../tools/vpn-profiles/prepare-storage-permissions.py . --verify-image
            python3 ../tools/prepare-service-toggle-colors.py . --verify-image
            grep -q '/wifi-qrcode-renderer.js' trunk/romfs/www/vpnsrv.asp
            ! grep -q '/qrcode.min.js' trunk/romfs/www/vpnsrv.asp
            grep -q 'wrVPNQrPayload' trunk/romfs/www/vpnsrv.asp
            grep -q 'name="vpns_awg_jc"' trunk/romfs/www/vpnsrv.asp
            for field in jc jmin jmax s1 s2 h1 h2 h3 h4; do
              grep -aq "vpns_awg_${field}" trunk/romfs/usr/sbin/httpd
            done
            cmp ../tools/wifi-qrcode-renderer.js trunk/romfs/www/wifi-qrcode-renderer.js
            grep -q '^wg_awg_options()' trunk/romfs/usr/bin/wgs.sh
            test -x trunk/romfs/usr/bin/wg-standard
            test -x trunk/romfs/usr/bin/awg
            readelf -h trunk/romfs/usr/bin/wg-standard | grep -q 'Machine:.*MIPS'
            ! cmp -s trunk/romfs/usr/bin/wg-standard trunk/romfs/usr/bin/awg
            test -x trunk/romfs/usr/bin/wgc.sh
            test -x trunk/romfs/usr/bin/wgs.sh
            test -L trunk/romfs/sbin/update_resolvconf
            ! grep -q '/lib/modules/3.4.113/' trunk/romfs/usr/bin/wgc.sh
            ! grep -q '/lib/modules/3.4.113/' trunk/romfs/usr/bin/wgs.sh
            readelf -h trunk/romfs/usr/bin/awg | grep -q 'Machine:.*MIPS'
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_OPENSSL_35=y$' trunk/.config; then
            test -s trunk/romfs/lib/libssl.so.3
            test -s trunk/romfs/lib/libcrypto.so.3
            test -s trunk/romfs/lib/libatomic.so.1
            grep -q '^SRC_NAME = openssl-3.5.7$' trunk/libs/libssl/3.5/Makefile
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_QUIC=y$' trunk/.config; then
            grep -q '^#define USE_NGTCP2 1$' trunk/libs/libcurl/curl-8.20.0/lib/curl_config.h
            grep -q '^#define USE_NGHTTP3 1$' trunk/libs/libcurl/curl-8.20.0/lib/curl_config.h
            test -x trunk/romfs/usr/bin/curl
            readelf -h trunk/romfs/usr/bin/curl | grep -q 'Machine:.*MIPS'
            python3 ../overlay/padavan-4.4/scripts/verify-curl-elf.py \
              trunk/romfs ../curl-elf-dependencies.json
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_TPROXY=y$' trunk/.config; then
            grep -q '^CONFIG_NETFILTER_XT_TARGET_TPROXY=m$' trunk/linux-4.4.x/.config
            tproxy_module="$(find trunk/romfs/lib/modules -name xt_TPROXY.ko -print -quit)"
            test -n "$tproxy_module"
            modinfo -F vermagic "$tproxy_module" | grep -q '^4.4.198'
            readelf -h "$tproxy_module" | grep -q 'Machine:.*MIPS'
            test -x trunk/romfs/bin/xtables-multi
            grep -a -q TPROXY trunk/romfs/bin/xtables-multi
            test -s trunk/user/iptables/iptables-1.8.7/extensions/libxt_TPROXY.o
            test -s trunk/user/iptables/iptables-1.8.7/extensions/libxt_socket.o
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_FS_TOOLS=y$' trunk/.config; then
            if grep -Eq '^CONFIG_FIRMWARE_ENABLE_EXT[234]=y$' trunk/.config; then
              for utility in e2fsck badblocks e2undo mke2fs tune2fs; do
                test -x "trunk/romfs/sbin/$utility"
                readelf -h "trunk/romfs/sbin/$utility" | grep -q 'Machine:.*MIPS'
              done
            fi
            if grep -Eq '^CONFIG_FIRMWARE_ENABLE_(FAT|EXFAT)=y$' trunk/.config; then
              test -x trunk/romfs/sbin/dosfsck
              readelf -h trunk/romfs/sbin/dosfsck | grep -q 'Machine:.*MIPS'
            fi
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_LUA=y$' trunk/.config; then
            test -x trunk/romfs/usr/bin/lua
            readelf -h trunk/romfs/usr/bin/lua | grep -q 'Machine:.*MIPS'
            test -s trunk/romfs/lib/liblua.so.5.1.5
            readelf -h trunk/romfs/lib/liblua.so.5.1.5 | grep -q 'Machine:.*MIPS'
            test -s trunk/romfs/etc_ro/lua/5.1/lib/cjson.so
            test -s trunk/romfs/etc_ro/lua/5.1/lib/nixio.so
          fi
          # Current WR1200JS port scope explicitly excludes CAKE/SQM.
          grep -q '^CONFIG_FIRMWARE_INCLUDE_SQM=n$' ../configs.build/wr1200js.config
          # Disabled selectors may be omitted from the normalized config.
          ! grep -Eq '^CONFIG_FIRMWARE_INCLUDE_SQM=(y|m)$' trunk/.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_SQM=y$' trunk/.config; then
            grep -q '^CONFIG_NET_SCH_CAKE=m$' trunk/linux-4.4.x/.config
            cake_module="$(find trunk/romfs/lib/modules -name sch_cake.ko -print -quit)"
            test -n "$cake_module"
            modinfo -F vermagic "$cake_module" | grep -q '^4\.4\.198'
            test -x trunk/romfs/bin/tc
            readelf -h trunk/romfs/bin/tc | grep -q 'Machine:.*MIPS'
            grep -a -q 'ack-filter' trunk/romfs/bin/tc
            test -x trunk/romfs/usr/lib/sqm/run.sh
            sh -n trunk/romfs/usr/lib/sqm/run.sh
            grep -q 'valid_rate' trunk/romfs/usr/lib/sqm/run.sh
            ! grep -q 'nvram commit' trunk/romfs/usr/lib/sqm/run.sh
            ! grep -q 'hwqos.sh' trunk/romfs/usr/lib/sqm/run.sh
            grep -q 'SQM_CAKE_Enable' trunk/romfs/www/Advanced_SQM.asp
            grep -q '^SQM_CAKE_Enable=' trunk/romfs/www/EN.dict
            for language in UK RU; do
              if grep -q "^CONFIG_FIRMWARE_INCLUDE_LANG_${language}=y$" trunk/.config; then
                grep -q '^SQM_CAKE_Enable=' "trunk/romfs/www/$language.dict"
              fi
            done
            grep -a -q 'wr1200js-sqm.lock' trunk/romfs/sbin/rc
          else
            # The current project scope excludes CAKE from the image.
            ! grep -Eq '^CONFIG_NET_SCH_CAKE=(y|m)$' trunk/linux-4.4.x/.config
            test -z "$(find trunk/romfs/lib/modules -name sch_cake.ko -print -quit)"
          fi
          if grep -q '^CONFIG_FIRMWARE_ENABLE_DNSMASQ_REGEX=y$' trunk/.config; then
            test -x trunk/romfs/usr/sbin/dnsmasq
            readelf -h trunk/romfs/usr/sbin/dnsmasq | grep -q 'Machine:.*MIPS'
            readelf -d trunk/romfs/usr/sbin/dnsmasq | grep -q 'Shared library:.*libpcre'
            find trunk/romfs/lib -name 'libpcre.so.*' -type f | grep -q .
            grep -a -q 'regex' trunk/romfs/usr/sbin/dnsmasq
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_EOIP=y$' trunk/.config; then
            eoip_module="$(find trunk/romfs/lib/modules -name eoip.ko -print -quit)"
            test -n "$eoip_module"
            modinfo -F vermagic "$eoip_module" | grep -q '^4\.4\.198'
            test -x trunk/romfs/usr/bin/eoip-ctl
            readelf -h trunk/romfs/usr/bin/eoip-ctl | grep -q 'Machine:.*MIPS'
            grep -a -q 'remove name' trunk/romfs/usr/bin/eoip-ctl
            grep -a -q 'owned-remove' trunk/romfs/usr/bin/eoip-ctl
            test -x trunk/romfs/usr/bin/eoip-service
            readelf -h trunk/romfs/usr/bin/eoip-service | grep -q 'Machine:.*MIPS'
            readelf -l trunk/romfs/usr/bin/eoip-service | grep -q '/lib/ld-uClibc.so.0'
            grep -a -q 'boot-table' trunk/romfs/usr/bin/eoip-service
            grep -a -q 'boot-stored' trunk/romfs/usr/bin/eoip-service
            readelf -d trunk/romfs/usr/bin/eoip-service | grep -q 'Shared library:.*libshared'
            test -x trunk/romfs/usr/bin/wr-eoip-boot
            cmp ../tools/eoip/boot.sh trunk/romfs/usr/bin/wr-eoip-boot
            test -s trunk/romfs/www/Advanced_Services_EoIP.asp
            cmp ../tools/eoip/status-view.js trunk/romfs/www/bootstrap/js/wr-eoip-status.js
            cmp ../tools/eoip/settings-editor.js trunk/romfs/www/bootstrap/js/wr-eoip-editor.js
            grep -q 'wr_eoip_status' trunk/romfs/www/Advanced_Services_EoIP.asp
            grep -q 'Advanced_Services_EoIP.asp' trunk/romfs/www/Advanced_Services_Content.asp
            grep -q '^WREOIPTitle=' trunk/romfs/www/UK.dict
            grep -q '^WREOIPTitle=' trunk/romfs/www/RU.dict
            grep -q '"eoip_enable", "0"' trunk/user/shared/defaults.c
            grep -q '"eoip_slot7_autostart", "0"' trunk/user/shared/defaults.c
            grep -q 'eval("/usr/bin/wr-eoip-boot", "boot")' trunk/user/rc/services.c
            grep -q 'eval("/usr/bin/wr-eoip-boot", "stop")' trunk/user/rc/services.c
          fi
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_VENDOR_LOGO=y$' trunk/.config; then
            cmp trunk/user/www/logo/padavan.png trunk/romfs/www/bootstrap/img/logo.png
          fi
          grep -q '^CONFIG_FIRMWARE_INCLUDE_DDNS_SSL=y$' trunk/.config
          python3 ../tools/services-nav/prepare-unified-nav.py trunk/romfs \
            --config trunk/.config --verify-image
          python3 ../tools/prepare-shadowsocks-localization.py trunk/romfs --verify-image
          python3 ../overlay/padavan-4.4/scripts/verify-ddns-elf.py \
            trunk/romfs ../ddns-elf-dependencies.json
          grep -a -q 'YouHua WR1200JS' trunk/linux-4.4.x/vmlinux
          cp trunk/.config ../firmware-effective.config
          cp trunk/linux-4.4.x/.config ../kernel-effective.config
          cp ../configs.build/wr1200js.config ../firmware-requested.config
          shopt -s nullglob
          images=(trunk/images/*.trx)
          (("${#images[@]}" > 0))
          for image in "${images[@]}"; do
            test -s "$image"
            size="$(stat -c %s "$image")"
            max_size=$((0xf70000))
            if ((size > max_size)); then
              echo "Firmware image exceeds the WR1200JS 0xF70000 partition."
              exit 1
            fi
            sha256sum "$image"
          done

      - name: Verify staged firmware upload tmpfs action
        run: |
          set -o pipefail
          python3 tools/tmp-upload/verify-tmp-upload-image.py padavan-4.4/trunk/romfs | tee tmp-upload-image-check.txt

      - name: Preserve tmpfs upload image verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tmp-upload-image-checks
          path: tmp-upload-image-check.txt
          if-no-files-found: warn

      - name: Verify station capacities from compiled radio flags
        run: |
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          python3 tools/connected-devices/check-built-radio-capacity.py padavan-4.4 \
            --compiler "$compiler" --output radio-capacity-evidence/capacities.json
      - name: Preserve actual radio capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wr1200js-radio-capacity
          path: radio-capacity-evidence/
          if-no-files-found: ignore

      - name: Probe effective IoT third-BSS radio capacity
        if: ${{ !cancelled() && steps.firmware_build.conclusion == 'success' }}
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          for radio in mt76x2 mt76x3; do
            # Build-step PATH does not persist into this Actions step. Resolve
            # the recorded Kbuild compiler using the same pinned toolchain.
            export PATH="$(dirname "$compiler"):$PATH"
            args=(--compiler "$compiler"
              --source-commit "$(git -C padavan-4.4 rev-parse HEAD)"
              --output "iot-capacity-evidence/$radio.json")
            # The initial isolated IoT SSID is 2.4 GHz only (MT7603/mt76x3).
            # Keep the 5 GHz result diagnostic until that band is part of the
            # agreed IoT scope.
            if [ "$radio" = mt76x3 ]; then
              args+=(--require-three-bss)
            fi
            python3 tools/iot/check-capacity.py \
              padavan-4.4/trunk/linux-4.4.x "$radio" "${args[@]}"
          done
      - name: Preserve effective IoT radio-capacity diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wr1200js-iot-radio-capacity
          path: iot-capacity-evidence/
          if-no-files-found: ignore

      - name: Verify requested and effective WR1200JS configuration
        run: |
          python3 tools/verify-wr1200js-config.py \
            configs.build/wr1200js.config firmware-effective.config kernel-effective.config \
            --report firmware-config-checks.json

      # The switch header adds topology definitions not present in Kconfig.
      # Evaluate that exact header rather than duplicating its branches.
      - name: Record effective WAN switch topology
        run: |
          python3 tools/wan-port/collect-topology.py \
            --kernel-config kernel-effective.config \
            --header padavan-4.4/trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl_mt762x.h \
            --output wan-port-topology.json

      - name: Preserve WAN switch topology evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wan-port-topology
          path: wan-port-topology.json
          if-no-files-found: ignore

      - name: Generate model setup guide from enabled services
        run: |
          python3 tools/generate-router-guide.py firmware-effective.config \
            --model WR1200JS \
            --build-number "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA" \
            --markdown SETUP_WR1200JS.md \
            --text SETUP_WR1200JS.txt \
            --report router-guide-report.json
          python3 tools/check-router-guide.py SETUP_WR1200JS.md SETUP_WR1200JS.txt

      - name: Verify every served WebUI file has an httpd route
        run: |
          python3 tools/check-web-routes.py padavan-4.4/trunk \
            --config firmware-effective.config --define BOARD_WR1200JS \
            --report web-route-checks.json

      - name: Verify complete EoIP WebUI and controller in ROMFS
        run: |
          test -s firmware-effective.config
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_EOIP=y$' firmware-effective.config; then
            python3 tools/eoip/verify-image.py padavan-4.4/trunk/romfs --report eoip-image-checks.json
          else
            python3 tools/eoip/verify-excluded.py padavan-4.4/trunk/romfs \
              configs.build/wr1200js.config firmware-effective.config --report eoip-image-checks.json
          fi

      - name: Preserve EoIP image checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eoip-image-checks
          path: eoip-image-checks.json
          if-no-files-found: error

      - name: Upload WebUI route diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wr1200js-web-route-checks
          path: web-route-checks.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload configuration policy diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wr1200js-config-checks
          path: firmware-config-checks.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify WR1200JS image upload structure
        run: |
          images=(padavan-4.4/trunk/images/WR1200JS_*.trx)
          test "${#images[@]}" -eq 1
          test -f "${images[0]}"
          image="${images[0]%.trx}_${GITHUB_SHA:0:8}.trx"
          mv -- "${images[0]}" "$image"
          python3 overlay/padavan-4.4/scripts/verify-wr1200js-image.py \
            "$image" \
            --report firmware-image-checks.json
          python3 tools/bind-router-guide-image.py "$image" SETUP_WR1200JS.md SETUP_WR1200JS.txt
          python3 tools/bind-router-guide-image.py "$image" SETUP_WR1200JS.md SETUP_WR1200JS.txt --check

      - name: Compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats | tee ccache-statistics.txt
            { echo '### WR1200JS compiler cache'; echo '```text'; cat ccache-statistics.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save compiler cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.cache-primary-key }}

      - name: Verify WPAD image packaging
        run: |
          python3 overlay/padavan-4.4/scripts/verify-wpad.py \
            padavan-4.4/trunk wpad-image-checks.json

      - name: Verify inherited settings backup and restore page
        run: |
          python3 overlay/padavan-4.4/scripts/verify-settings-backup.py \
            padavan-4.4/trunk/romfs settings-backup-image-checks.json

      - name: Upload settings backup and restore diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-backup-image-checks
          path: settings-backup-image-checks.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify wireless offload policy labels
        run: python3 tools/prepare-wifi-hwnat-ui.py padavan-4.4 --verify-image

      - name: Verify inherited WireGuard page translations
        run: |
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y' padavan-4.4/trunk/.config; then
            python3 overlay/padavan-4.4/scripts/localize-wireguard-page.py padavan-4.4 --verify-image
          fi

      - name: Verify inherited dictionary translations
        run: python3 overlay/padavan-4.4/scripts/localize-inherited-dicts.py padavan-4.4 --verify-image
      - name: Verify WR1200JS footer attribution and upstream notices
        run: python3 overlay/padavan-4.4/scripts/add-wr1200js-footer-credit.py padavan-4.4 --verify-image
      - name: Verify RSSI threshold captions and tooltips in image dictionaries
        run: python3 overlay/padavan-4.4/scripts/localize-rssi-thresholds.py padavan-4.4 --verify-image

      - name: Verify Stubby image packaging and ELF dependencies
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_STUBBY=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/stubby/verify-image.py \
              padavan-4.4/trunk stubby-image-checks.json
          fi

      - name: Resolve names through the image Stubby under QEMU
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_STUBBY=y$' configs.build/wr1200js.config; then
            sudo apt-get install --no-install-recommends -y qemu-user-static dnsutils iptables
            sh overlay/padavan-4.4/ports/stubby/check-stubby-runtime.sh \
              padavan-4.4/trunk/romfs --outage 2>&1 | tee stubby-runtime.txt
          fi

      - name: Verify zram dependencies and shipped swap priority support
        run: |
          sudo apt-get install --no-install-recommends -y qemu-user-static proot
          set -o pipefail
          python3 tools/verify-zram-image.py padavan-4.4 | tee zram-image-checks.txt

      - name: Audit all shipped shell scripts with exact target BusyBox
        run: python3 tools/check-target-busybox.py padavan-4.4 --output target-busybox-audit.json

      - name: Exercise VPN profile service lock path with exact target BusyBox
        run: |
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y' configs.build/wr1200js.config; then
            python3 tools/vpn-profiles/check-target-service.py \
              padavan-4.4/trunk/romfs --output vpn-service-target-busybox.json
          fi

      - name: Check shipped WireGuard server export with exact target BusyBox
        run: |
          set -o pipefail
          python3 tools/check-wg-server-export.py --target-root padavan-4.4/trunk/romfs | tee target-wg-export-check.txt

      - name: Check USBIP restore orchestration with exact target BusyBox
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_USBIP=y$' configs.build/wr1200js.config; then
            python3 tools/usbip/check-restore.py --target-root padavan-4.4/trunk/romfs
          fi

      - name: Verify packaged MIPS VPN profile tools
        run: |
          if grep -qx 'CONFIG_FIRMWARE_INCLUDE_WIREGUARD=y' configs.build/wr1200js.config; then
            options=()
            if grep -qx 'CONFIG_FIRMWARE_INCLUDE_AMNEZIAWG=y' configs.build/wr1200js.config; then options+=(--amneziawg); fi
            python3 tools/vpn-profiles/verify-image.py padavan-4.4/trunk/romfs "${options[@]}" --output vpn-profile-image.json
            python3 tools/vpn-profiles/check-target-manager.py padavan-4.4/trunk/romfs "${options[@]}" --output vpn-manager-mips.json
            compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -path '*/bin/mipsel-linux-uclibc-gcc' -print -quit)"
            test -x "$compiler"
            "$compiler" -std=gnu99 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float tools/vpn-profiles/check-link.c tools/vpn-profiles/link-observation.c -o vpn-link-mips
            qemu-mipsel-static -L padavan-4.4/trunk/romfs ./vpn-link-mips | tee vpn-link-mips.txt
          fi

      - name: Preserve VPN profile image checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vpn-profile-image
          path: |
            vpn-profile-image.json
            vpn-link-mips.txt
            vpn-manager-mips.json
            vpn-service-target-busybox.json
          if-no-files-found: ignore

      - name: Verify USBIP settings UI and linked HTTP storage code
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_USBIP=y$' configs.build/wr1200js.config; then
            python3 tools/usbip/verify-settings-image.py padavan-4.4 --output usbip-settings-image.json
          fi

      - name: Preserve USBIP settings image evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usbip-settings-image
          path: usbip-settings-image.json
          if-no-files-found: ignore

      - name: Preserve target BusyBox audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: target-busybox-audit
          path: |
            target-busybox-audit.json
            target-wg-export-check.txt
          if-no-files-found: ignore

      - name: Preserve zram image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zram-image-checks
          path: zram-image-checks.txt
          if-no-files-found: warn

      - name: Upload Stubby image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stubby-image-checks
          retention-days: 14
          if-no-files-found: ignore
          path: |
            stubby-image-checks.json
            stubby-runtime.txt

      - name: Verify Privoxy image packaging and ELF dependencies
        run: |
          if grep -q '^CONFIG_FIRMWARE_INCLUDE_PRIVOXY=y$' configs.build/wr1200js.config; then
            python3 overlay/padavan-4.4/ports/privoxy/verify-image.py \
              padavan-4.4/trunk privoxy-image-checks.json
            python3 tools/check-privoxy-target-config.py padavan-4.4/trunk/romfs \
              --report privoxy-target-config.json
          fi

      - name: Upload Privoxy image diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: privoxy-image-checks
