      - name: Compile package against actual isolated steering drivers
        if: ${{ inputs.run_candidate_checks && (!cancelled() && steps.firmware_build.conclusion == 'success' && steps.steering_prepare.outputs.enabled != 'y') }}
        run: |
          set -euo pipefail
