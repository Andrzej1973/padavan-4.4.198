      - name: Link isolated MT7621 systick candidate kernel
        if: ${{ inputs.run_candidate_checks && (!cancelled() && steps.firmware_build.conclusion == 'success' && steps.steering_prepare.outputs.enabled != 'y') }}
        run: |
          set -euo pipefail
          source_kernel="$PWD/padavan-4.4/trunk/linux-4.4.x"
          kernel="$RUNNER_TEMP/wr1200js-systick-link"
          test ! -e "$kernel"
          cp -a "$source_kernel" "$kernel"
          python3 tools/band-steering/prepare-nvram-snapshot.py --kernel-root "$kernel"
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          candidate="$PWD/overlay/padavan-4.4/candidates/cpu-sleep"
          python3 "$candidate/prepare-link-candidate.py" "$kernel"
          python3 "$candidate/activate-link-config.py" "$kernel"
          make -C "$kernel" ARCH=mips CROSS_COMPILE="$cross" olddefconfig \
            2>&1 | tee cpu-sleep-config.log
          grep -qx 'CONFIG_CLKEVT_MT7621_SYSTICK=y' "$kernel/.config"
          python3 "$candidate/activate-link-dts.py" "$kernel"
          make -C "$kernel" ARCH=mips CROSS_COMPILE="$cross" -j2 vmlinux \
            2>&1 | tee cpu-sleep-link.log
          test -s "$kernel/vmlinux"
          # nvram_linux.c includes nvram.c; Kbuild emits no standalone nvram.o.
          test -s "$kernel/drivers/nvram/nvram_linux.o"
          "${cross}objdump" -dr "$kernel/drivers/nvram/nvram_linux.o" > nvram-snapshot-kernel-disassembly.txt
          "${cross}nm" "$kernel/vmlinux" > nvram-snapshot-kernel-symbols.txt
          grep -Eq '[[:space:]]_nvram_getall$' nvram-snapshot-kernel-symbols.txt
          grep -a -q 'mediatek,mt7621-systick' "$kernel/vmlinux"
          cp "$kernel/arch/mips/boot/dts/ralink/wr1200js.dts" cpu-sleep-board.dts
          dtb="$(find "$kernel/arch/mips/boot" -name wr1200js.dtb -type f -print -quit)"
          test -n "$dtb"
          test -s "$dtb"
          cp "$dtb" cpu-sleep-board.dtb
          "$kernel/scripts/dtc/dtc" -I dtb -O dts "$dtb" > cpu-sleep-compiled-board.dts
          "${cross}readelf" -h "$kernel/vmlinux" > cpu-sleep-elf.txt
          grep -q 'Machine:.*MIPS' cpu-sleep-elf.txt
          "${cross}nm" "$kernel/vmlinux" > cpu-sleep-symbols.txt
          grep -Eq '[[:space:]]mt7621_systick_early_init$' cpu-sleep-symbols.txt
          cp "$kernel/.config" cpu-sleep-link.config
          sha256sum "$kernel/vmlinux" > cpu-sleep-vmlinux.sha256
          sha256sum "$kernel/drivers/nvram/nvram.c" "$kernel/drivers/nvram/nvram_linux.o" > nvram-snapshot-kernel-sha256.txt

      - name: Upload isolated kernel link diagnostics
