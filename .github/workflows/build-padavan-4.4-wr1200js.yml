            cpu-sleep-symbols.txt
            cpu-sleep-link.config
            cpu-sleep-vmlinux.sha256
            cpu-sleep-board.dts
            cpu-sleep-board.dtb
            cpu-sleep-compiled-board.dts
            nvram-snapshot-kernel-disassembly.txt
            nvram-snapshot-kernel-symbols.txt
            nvram-snapshot-kernel-sha256.txt


      - name: Compile ZeroTier 1.16.2 source candidate
        if: ${{ inputs.run_candidate_checks }}
        run: |
          set -euo pipefail
          git init zerotier-candidate
          git -C zerotier-candidate fetch --depth=1 https://github.com/zerotier/ZeroTierOne.git fe29cd88886e4f58547ba7f740b2d73eb49ab222
          git -C zerotier-candidate checkout --detach FETCH_HEAD
          test "$(git -C zerotier-candidate rev-parse HEAD)" = fe29cd88886e4f58547ba7f740b2d73eb49ab222
          python3 tools/prepare-zerotier-source.py zerotier-candidate
          sha256sum zerotier-candidate/make-linux.mk > zerotier-candidate-prepared.sha256
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          make -C zerotier-candidate -j2 zerotier-one \
            CC="$compiler" CXX="${cross}g++" AR="${cross}ar" \
            ZT_EMBEDDED=1 ZT_SSO_SUPPORTED=0 ZT_NONFREE=0 ZT_CONTROLLER=0 ZT_OTEL=0 \
            MINIUPNPC_IS_NEW_ENOUGH=0 \
            CFLAGS="-O2 -mips32r2 -ffunction-sections -fdata-sections" \
            CXXFLAGS="-O2 -mips32r2 -ffunction-sections -fdata-sections" \
            LDFLAGS="-Wl,--gc-sections -static-libstdc++" LDLIBS="-latomic" \
            2>&1 | tee zerotier-candidate-build.log
          readelf -h zerotier-candidate/zerotier-one | tee zerotier-candidate-elf.txt
          grep -q 'Machine:.*MIPS' zerotier-candidate-elf.txt
          readelf -d zerotier-candidate/zerotier-one > zerotier-candidate-dependencies.txt

      - name: Upload ZeroTier source candidate diagnostics
        if: ${{ inputs.run_candidate_checks && (always()) }}
        uses: actions/upload-artifact@v7
        with:
          name: zerotier-1.16.2-candidate
