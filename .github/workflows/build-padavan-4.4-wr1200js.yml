      - name: Compile complete isolated rc with steering profile integration
        if: ${{ !cancelled() && steps.firmware_build.conclusion == 'success' && steps.steering_prepare.outputs.enabled != 'y' }}
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          bash tools/band-steering/compile-rc-profile.sh "$PWD/padavan-4.4/trunk" \
            "$RUNNER_TEMP/wr1200js-steering-rc-probe" "$compiler"
      - name: Upload full rc profile integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-steering-full-rc-profile-probe
          path: ${{ runner.temp }}/wr1200js-steering-rc-probe/results/
          if-no-files-found: ignore

      - name: Compile EoIP IPv4 candidate module
        run: |
          set -euo pipefail
          kernel="$PWD/padavan-4.4/trunk/linux-4.4.x"
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          candidate="$PWD/overlay/padavan-4.4/candidates/eoip/unified"
          make -C "$kernel" ARCH=mips CROSS_COMPILE="$cross" M="$candidate" modules \
            2>&1 | tee eoip-compile.log
          test -s "$candidate/eoip.ko"
          readelf -h "$candidate/eoip.ko" | grep -q 'Machine:.*MIPS'
          modinfo -F vermagic "$candidate/eoip.ko" | grep -q '^4\.4\.198'
          tool="${candidate%/unified}"
          "$compiler" -Os -std=gnu99 -Wall -Wextra -o "$tool/eoip" \
            "$tool/eoipcr.c" "$tool/libnetlink.c" 2>&1 | tee eoip-tool-compile.log
          test -s "$tool/eoip"
          readelf -h "$tool/eoip" | grep -q 'Machine:.*MIPS'
          readelf -l "$tool/eoip" | grep -q '/lib/ld-uClibc.so.0'


      - name: Upload EoIP candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eoip-candidate-compile
          if-no-files-found: ignore
          retention-days: 14
          path: |
            eoip-compile.log
            eoip-tool-compile.log
            overlay/padavan-4.4/candidates/eoip/unified/eoip.ko
            overlay/padavan-4.4/candidates/eoip/eoip

      - name: Compile package against actual isolated steering drivers
        if: ${{ !cancelled() && steps.firmware_build.conclusion == 'success' && steps.steering_prepare.outputs.enabled != 'y' }}
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          bash tools/band-steering/compile-driver-package.sh \
            "$RUNNER_TEMP/wr1200js-steering-driver-probe" \
            "$PWD/band-steering-driver-package-results" "$compiler"
          python3 tools/band-steering/verify-package-closure.py \
            "$PWD/band-steering-driver-package-results/romfs" "$PWD/padavan-4.4/trunk/romfs" \
            --readelf "${compiler%gcc}readelf" \
            --output "$PWD/band-steering-driver-package-results/dependency-closure.json"
          bash tools/band-steering/compile-registered-package.sh \
            "$PWD/padavan-4.4/trunk" \
            "$PWD/band-steering-driver-package-results/abi/protocol-layout.h" \
            "$PWD/band-steering-driver-package-results/registered" "$compiler"

      - name: Upload driver-matched steering package diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-steering-driver-package-probe
          path: band-steering-driver-package-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Compile PCRE2 candidate for modern Privoxy
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          mkdir -p pcre2-candidate-build
          cd pcre2-candidate-build
          curl --fail --location --retry 3 --output pcre2-10.49.tar.bz2 \
            https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.bz2
          echo '53c156e1ba416a20da8e65395daa132da0d80e76910424caca3fcdae7831d384  pcre2-10.49.tar.bz2' | sha256sum -c -
          tar xjf pcre2-10.49.tar.bz2
          cd pcre2-10.49
          CC="$compiler" AR="${cross}ar" RANLIB="${cross}ranlib" \
            CFLAGS="-O2 -fPIC -mips32r2" \
            ./configure --host=mipsel-linux-uclibc --build="$(gcc -dumpmachine)" \
              --prefix=/ --libdir=/lib --includedir=/include \
              --enable-pcre2-8 --disable-pcre2-16 --disable-pcre2-32 \
              --enable-unicode --disable-jit --enable-shared --enable-static \
              --disable-pcre2grep-libz --disable-pcre2grep-libbz2 \
              2>&1 | tee ../configure.log
          make -j2 2>&1 | tee ../compile.log
          make install DESTDIR="$PWD/../stage"
          readelf -h ../stage/lib/libpcre2-8.so.0 | grep -q 'Machine:.*MIPS'
          readelf -d ../stage/lib/libpcre2-8.so.0 > ../elf-dependencies.txt

      - name: Upload PCRE2 candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pcre2-candidate
          if-no-files-found: ignore
          retention-days: 14
          path: |
            pcre2-candidate-build/*.log
            pcre2-candidate-build/elf-dependencies.txt
            pcre2-candidate-build/stage/lib/libpcre2-8.so*
            pcre2-candidate-build/stage/lib/libpcre2-posix.so*

      - name: Compile Privoxy 4.2 candidate
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          PRIVOXY_CANDIDATE_DIR="$PWD/privoxy-candidate-build" \
          TARGET_CC="$compiler" \
          TARGET_STAGE="$PWD/padavan-4.4/trunk/stage" \
          PCRE2_STAGE="$PWD/pcre2-candidate-build/stage" \
          TARGET_CFLAGS="-O2 -mips32r2" \
            sh overlay/padavan-4.4/candidates/privoxy/compile-privoxy.sh

      - name: Upload Privoxy candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: privoxy-candidate
          if-no-files-found: ignore
          retention-days: 14
          path: |
            privoxy-candidate-build/*.log
            privoxy-candidate-build/elf-*.txt
            privoxy-candidate-build/privoxy-4.2.0-stable/config.log
            privoxy-candidate-build/privoxy-4.2.0-stable/config.h
            privoxy-candidate-build/privoxy-4.2.0-stable/privoxy

      - name: Compile Stubby DoT candidate
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          TARGET_CC="$compiler" \
          TARGET_STAGE="$PWD/padavan-4.4/trunk/stage" \
          STUBBY_CANDIDATE_DIR="$PWD/stubby-candidate-build" \
            bash overlay/padavan-4.4/candidates/stubby/compile-stubby.sh

      - name: Upload Stubby candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stubby-candidate
          if-no-files-found: ignore
          retention-days: 14
          path: |
            stubby-candidate-build/*.log
            stubby-candidate-build/elf-*.txt
            stubby-candidate-build/stubby-mips
            stubby-candidate-build/build/CMakeCache.txt
            stubby-candidate-build/build/CMakeFiles/CMake*.log

      - name: Link isolated MT7621 systick candidate kernel
        if: ${{ !cancelled() && steps.firmware_build.conclusion == 'success' && steps.steering_prepare.outputs.enabled != 'y' }}
        run: |
          set -euo pipefail
          source_kernel="$PWD/padavan-4.4/trunk/linux-4.4.x"
          kernel="$RUNNER_TEMP/wr1200js-systick-link"
          test ! -e "$kernel"
          cp -a "$source_kernel" "$kernel"
          python3 tools/band-steering/prepare-nvram-snapshot.py --kernel-root "$kernel"
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          candidate="$PWD/overlay/padavan-4.4/candidates/cpu-sleep"
          python3 "$candidate/prepare-link-candidate.py" "$kernel"
          python3 "$candidate/activate-link-config.py" "$kernel"
          make -C "$kernel" ARCH=mips CROSS_COMPILE="$cross" olddefconfig \
            2>&1 | tee cpu-sleep-config.log
          grep -qx 'CONFIG_CLKEVT_MT7621_SYSTICK=y' "$kernel/.config"
          python3 "$candidate/activate-link-dts.py" "$kernel"
          make -C "$kernel" ARCH=mips CROSS_COMPILE="$cross" -j2 vmlinux \
            2>&1 | tee cpu-sleep-link.log
          test -s "$kernel/vmlinux"
          # nvram_linux.c includes nvram.c; Kbuild emits no standalone nvram.o.
          test -s "$kernel/drivers/nvram/nvram_linux.o"
          "${cross}objdump" -dr "$kernel/drivers/nvram/nvram_linux.o" > nvram-snapshot-kernel-disassembly.txt
          "${cross}nm" "$kernel/vmlinux" > nvram-snapshot-kernel-symbols.txt
          grep -Eq '[[:space:]]_nvram_getall$' nvram-snapshot-kernel-symbols.txt
          grep -a -q 'mediatek,mt7621-systick' "$kernel/vmlinux"
          cp "$kernel/arch/mips/boot/dts/ralink/wr1200js.dts" cpu-sleep-board.dts
          dtb="$(find "$kernel/arch/mips/boot" -name wr1200js.dtb -type f -print -quit)"
          test -n "$dtb"
          test -s "$dtb"
          cp "$dtb" cpu-sleep-board.dtb
          "$kernel/scripts/dtc/dtc" -I dtb -O dts "$dtb" > cpu-sleep-compiled-board.dts
          "${cross}readelf" -h "$kernel/vmlinux" > cpu-sleep-elf.txt
          grep -q 'Machine:.*MIPS' cpu-sleep-elf.txt
          "${cross}nm" "$kernel/vmlinux" > cpu-sleep-symbols.txt
          grep -Eq '[[:space:]]mt7621_systick_early_init$' cpu-sleep-symbols.txt
          cp "$kernel/.config" cpu-sleep-link.config
          sha256sum "$kernel/vmlinux" > cpu-sleep-vmlinux.sha256
          sha256sum "$kernel/drivers/nvram/nvram.c" "$kernel/drivers/nvram/nvram_linux.o" > nvram-snapshot-kernel-sha256.txt

      - name: Upload isolated kernel link diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mt7621-systick-link
          if-no-files-found: ignore
          retention-days: 14
          path: |
            cpu-sleep-config.log
            cpu-sleep-link.log
            cpu-sleep-elf.txt
            cpu-sleep-symbols.txt
            cpu-sleep-link.config
            cpu-sleep-vmlinux.sha256
            cpu-sleep-board.dts
            cpu-sleep-board.dtb
            cpu-sleep-compiled-board.dts
            nvram-snapshot-kernel-disassembly.txt
            nvram-snapshot-kernel-symbols.txt
            nvram-snapshot-kernel-sha256.txt


      - name: Compile ZeroTier 1.16.2 source candidate
        run: |
          set -euo pipefail
          git init zerotier-candidate
          git -C zerotier-candidate fetch --depth=1 https://github.com/zerotier/ZeroTierOne.git fe29cd88886e4f58547ba7f740b2d73eb49ab222
          git -C zerotier-candidate checkout --detach FETCH_HEAD
          test "$(git -C zerotier-candidate rev-parse HEAD)" = fe29cd88886e4f58547ba7f740b2d73eb49ab222
          python3 tools/prepare-zerotier-source.py zerotier-candidate
          sha256sum zerotier-candidate/make-linux.mk > zerotier-candidate-prepared.sha256
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          cross="${compiler%gcc}"
          make -C zerotier-candidate -j2 zerotier-one \
            CC="$compiler" CXX="${cross}g++" AR="${cross}ar" \
            ZT_EMBEDDED=1 ZT_SSO_SUPPORTED=0 ZT_NONFREE=0 ZT_CONTROLLER=0 ZT_OTEL=0 \
            MINIUPNPC_IS_NEW_ENOUGH=0 \
            CFLAGS="-O2 -mips32r2 -ffunction-sections -fdata-sections" \
            CXXFLAGS="-O2 -mips32r2 -ffunction-sections -fdata-sections" \
            LDFLAGS="-Wl,--gc-sections -static-libstdc++" LDLIBS="-latomic" \
            2>&1 | tee zerotier-candidate-build.log
          readelf -h zerotier-candidate/zerotier-one | tee zerotier-candidate-elf.txt
          grep -q 'Machine:.*MIPS' zerotier-candidate-elf.txt
          readelf -d zerotier-candidate/zerotier-one > zerotier-candidate-dependencies.txt

      - name: Upload ZeroTier source candidate diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zerotier-1.16.2-candidate
          if-no-files-found: ignore
          retention-days: 14
          path: |
            zerotier-candidate-build.log
            zerotier-candidate-elf.txt
            zerotier-candidate-dependencies.txt
            zerotier-candidate-prepared.sha256
            zerotier-candidate/make-linux.mk
            zerotier-candidate/zerotier-one

      - name: Record WR1200JS board build status
        if: always()
        env:
          BOARD_BUILD_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('board-build-status.json').write_text(json.dumps({'board':'wr1200js','status':os.environ['BOARD_BUILD_STATUS']}) + '\n')
          PY
      - name: Upload board build status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: board-build-status-wr1200js
          path: board-build-status.json
          if-no-files-found: error
