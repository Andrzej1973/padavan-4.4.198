name: Zapret2 nfqws2 candidate

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/zapret2/**'
      - 'third_party/netfilter/**'
      - '.github/workflows/zapret2-candidate.yml'

permissions:
  contents: read

jobs:
  build-nfqws2:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PADAVAN_COMMIT: c25283e915a2a00a763774dd255b14aff997285e
    steps:
      - uses: actions/checkout@v6

      - name: Fetch pinned Padavan source
        run: |
          git init padavan-4.4
          git -C padavan-4.4 remote add origin https://github.com/vipshmily/padavan-4.4.git
          python3 tools/retry-source-command.py git -C padavan-4.4 fetch --depth=1 origin "$PADAVAN_COMMIT"
          python3 tools/retry-source-command.py git -C padavan-4.4 checkout --detach FETCH_HEAD
          test "$(git -C padavan-4.4 rev-parse HEAD)" = "$PADAVAN_COMMIT"

      - name: Restore pinned owned toolchain archive
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/mips-toolchains
          key: mips-toolchain-${{ runner.os }}-de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256
      - name: Download the Linux 4.4 uClibc toolchain
        run: |
          mkdir -p padavan-4.4/toolchain/toolchain-mipsel
          toolchain_cache="$GITHUB_WORKSPACE/.cache/mips-toolchains/de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256.tar.xz"
          mkdir -p "$(dirname "$toolchain_cache")"
          trap 'rm -f -- "$toolchain_cache.part"' EXIT
          if ! echo 'de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256  '"$toolchain_cache" | sha256sum -c - >/dev/null 2>&1; then
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
              --header 'Accept: application/octet-stream' \
              --output "$toolchain_cache.part" \
              https://api.github.com/repos/Andrzej1973/padavan-4.4.198/releases/assets/723466303
            echo 'de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256  '"$toolchain_cache.part" | sha256sum -c -
            mv -- "$toolchain_cache.part" "$toolchain_cache"
          fi
          cp -- "$toolchain_cache" padavan-4.4/toolchain-mipsel.tar.xz
          python3 tools/verify-source-archive.py mipsel-linux-uclibc-toolchain padavan-4.4/toolchain-mipsel.tar.xz
          tar -xJf padavan-4.4/toolchain-mipsel.tar.xz \
            -C padavan-4.4/toolchain/toolchain-mipsel

      - name: Verify the pinned dependency archives
        run: python3 tools/zapret2/verify-deps-base.py

      - name: Prepare and check the Zapret2 WebUI
        run: |
          python3 tools/zapret2/prepare-web.py padavan-4.4
          python3 tools/zapret2/check-web.py padavan-4.4 --node
          python3 tools/zapret2/check-web-backend.py padavan-4.4

      - name: Check the service lifecycle
        run: sh tools/zapret2/test-service.sh

      - name: Stage and build nfqws2
        run: |
          set -euo pipefail
          python3 tools/zapret2/prepare-package.py padavan-4.4
          compiler="$(find "$PWD/padavan-4.4/toolchain/toolchain-mipsel" -path '*/bin/mipsel-linux-uclibc-gcc' -print -quit)"
          test -n "$compiler"
          CC="$compiler" \
          CFLAGS="-O2 -mips32r2 -mabi=32 -msoft-float" \
          LDFLAGS="-mips32r2 -mabi=32 -msoft-float" \
            sh tools/zapret2/build-nfqws2.sh padavan-4.4 nfqws2-candidate \
              padavan-4.4/trunk/user/zapret2/deps
          file nfqws2-candidate
          size nfqws2-candidate | tee nfqws2-size.txt
          readelf -d nfqws2-candidate > nfqws2-dynamic.txt
          python3 tools/zapret2/check-candidate.py \
            nfqws2-candidate nfqws2-dynamic.txt nfqws2-candidate.json

      - name: Upload candidate binary and report
        uses: actions/upload-artifact@v7
        with:
          name: zapret2-nfqws2-candidate
          path: |
            nfqws2-candidate
            nfqws2-candidate.json
            nfqws2-size.txt
            nfqws2-dynamic.txt
          if-no-files-found: error
