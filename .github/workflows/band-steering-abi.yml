      - 'tools/band-steering/prepare-main-bss-check.py'
      - 'tools/band-steering/profile-policy.c'
      - 'tools/band-steering/verify-package-closure.py'
      - 'tools/band-steering/check-package-closure.py'
      - 'tools/band-steering/profile-policy.h'
      - 'tools/band-steering/check-profile-policy.c'
      - 'tools/band-steering/prepare-profile-integration.py'
      - 'tools/band-steering/prepare-profile-snapshot.py'
      - 'tools/band-steering/prepare-wifi-snapshot.py'
      - 'tools/band-steering/prepare-radio-snapshot.py'
      - 'tools/band-steering/prepare-board-defaults.py'
      - 'tools/band-steering/check-board-defaults.py'
      - 'tools/prepare-wifi-hwnat-mode.py'
      - 'tools/wifi-hwnat-original-block.txt'
      - 'tools/band-steering/prepare-hwnat-check.py'
      - 'tools/band-steering/prepare-source-integration.py'
      - 'tools/band-steering/prepare-package-integration.py'
      - 'tools/band-steering/prepare-web-controls.py'
      - 'tools/band-steering/prepare-status-query.py'
      - 'tools/band-steering/prepare-status-check.py'
      - 'tools/band-steering/prepare-status-web.py'
      - 'tools/band-steering/prepare-status-web-check.py'
      - 'tools/band-steering/prepare-status-ui.py'
      - 'tools/band-steering/status-ui.js'
      - 'tools/band-steering/check-status-ui.js'
      - 'tools/band-steering/check-radio-read-guard.py'
