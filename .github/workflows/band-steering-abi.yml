permissions:
  contents: read
jobs:
  inspect-driver-abi:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: vipshmily/padavan-4.4
          ref: c25283e915a2a00a763774dd255b14aff997285e
          path: source
          sparse-checkout: |
            trunk/user/rc
            trunk/user/shared
            trunk/user/httpd
            trunk/user/www
            trunk/linux-4.4.x/drivers/nvram
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x2
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x3
      - name: Verify steering package dependency checker logic
        run: python3 tools/band-steering/check-package-closure.py
      - name: Verify WR board steering selectors and factory OFF
        run: |
          python3 tools/band-steering/check-board-defaults.py source \
            overlay/padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config \
            board-defaults-checks --preprocessor gcc
      - name: Prepare non-deauth idle-entry protocol
        run: |
          mkdir source-integration
          cp -a source/trunk source-integration/
          mkdir -p source-integration/trunk/configs/boards/WR1200JS
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config \
            source-integration/trunk/configs/boards/WR1200JS/
          python3 tools/band-steering/prepare-idle-aging.py source
      - name: Prepare read-only grant queries
        run: python3 tools/band-steering/prepare-grant-readback.py source
      - name: Prepare main-network-only legacy steering
        run: python3 tools/band-steering/prepare-main-bss.py source
      - name: Download and verify the firmware toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir toolchain
          curl --fail --location --retry 3 --output toolchain.tar.xz \
            https://github.com/vipshmily/padavan-4.4/releases/download/toolchain/mipsel-linux-uclibc.tar.xz
          echo 'de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256  toolchain.tar.xz' | sha256sum -c -
          tar -xJf toolchain.tar.xz -C toolchain
      - name: Verify Wi-Fi HNAT mode on interface bring-up
        run: |
          cp -a source hwnat-mode-source
          python3 tools/prepare-wifi-hwnat-mode.py hwnat-mode-source --lan-only-default
          grep -q '{ "hw_nat_mode", "2" }' hwnat-mode-source/trunk/user/shared/defaults.c
          mkdir -p hwnat-mode-checks
          python3 tools/band-steering/prepare-hwnat-check.py hwnat-mode-source --output hwnat-mode-checks/check.c
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check.c -o hwnat-mode-checks/check
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check-network.c -o hwnat-mode-checks/check-network
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check-network
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check-log.c -o hwnat-mode-checks/check-log
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check-log
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check.c -o hwnat-mode-checks/check-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check-network.c -o hwnat-mode-checks/check-network-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check-log.c -o hwnat-mode-checks/check-log-mips.o
      - name: Verify complete source preparation and registered target package
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('configs.build/wr1200js.config')
          lines = [l for l in p.read_text().splitlines()
                   if 'CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING=' not in l]
          Path('source-integration/requested.config').write_text(
              '\n'.join(lines)+ '\nCONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING=y\n')
          PY
          python3 tools/band-steering/prepare-source-integration.py source-integration \
            --config source-integration/requested.config --compiler "$compiler"
          make -C source-integration/trunk/user/wr-band-steering \
            CC="$compiler" CFLAGS="-O2 -mips32r2 -mabi=32 -msoft-float" \
            INSTALLDIR="$PWD/source-integration/romfs" romfs
          for name in wr-band-steering wr-band-steering-ctl; do
            "${compiler%gcc}readelf" -h "source-integration/romfs/usr/sbin/$name" \
              > "source-integration/$name-elf.txt"
            grep -q 'Machine:.*MIPS' "source-integration/$name-elf.txt"
          done
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('source-integration')
          r = json.loads((root/'band-steering-source-integration.json').read_text())
          assert r['preparation_complete'] and not r['factory_enabled']
          assert not r['runtime_verified'] and len(r['steps']) == 22
          files = {}
          for name in ('wr-band-steering', 'wr-band-steering-ctl'):
              data = (root/'romfs/usr/sbin'/name).read_bytes()
              assert len(data) > 0
              files[name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          (root/'package-checks.json').write_text(json.dumps({
              'target_compilation_verified': True, 'production_installed': False,
              'runtime_verified': False, 'factory_enabled': False, 'binaries': files,
              'scope': 'Complete source preparation and userspace package, not a complete integrated image'
          }, indent=2)+'\n')
          PY
      - name: Preserve complete source integration diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-steering-complete-source-integration
          path: |
            source-integration/band-steering-*.json
            source-integration/package-checks.json
            source-integration/*-elf.txt
            source-integration/band-steering-source-abi/
            source-integration/romfs/
          if-no-files-found: ignore
          retention-days: 14
      - name: Generate and compile target ABI probes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-abi-probe.py source --output abi-results
          cp source/band-steering-idle-preparation.json abi-results/
          cp source/band-steering-grant-preparation.json abi-results/
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" --version > abi-results/compiler-version.txt
          git -C source rev-parse HEAD > abi-results/source-revision.txt
          for radio in mt76x2 mt76x3; do
            "$compiler" -std=gnu11 -mips32r2 -mabi=32 -msoft-float -O2 -c \
              "abi-results/$radio-abi.c" -o "abi-results/$radio-abi.o"
          done
          python3 tools/band-steering/read-abi-probe.py abi-results
          cp source/band-steering-main-bss-preparation.json abi-results/
          python3 tools/band-steering/prepare-main-bss-check.py source abi-results
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            abi-results/main-bss-check.c -o abi-results/check-main-bss
          abi-results/check-main-bss | tee abi-results/main-bss-checks.txt
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c abi-results/main-bss-check.c -o abi-results/main-bss-mips.o
      - name: Verify read-only profile compatibility policy
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/profile-policy.c tools/band-steering/check-profile-policy.c \
            -o abi-results/check-profile-policy
          abi-results/check-profile-policy | tee abi-results/profile-policy-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/profile-policy.c -o abi-results/profile-policy-mips.o
      - name: Verify rc profile integration candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-profile-integration.py source
          python3 tools/band-steering/prepare-profile-check.py source abi-results
          cp source/band-steering-profile-integration.json abi-results/
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-profile-policy.c abi-results/profile-integration-check.c \
            -o abi-results/check-profile-integration
          abi-results/check-profile-integration | tee abi-results/profile-integration-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -Iabi-results -c abi-results/profile-integration-check.c \
            -o abi-results/profile-integration-mips.o
      - name: Verify actual rc Wi-Fi lifecycle callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-child-reaper.py source
          python3 tools/band-steering/prepare-wifi-lifecycle.py source
          python3 tools/band-steering/prepare-wifi-check.py source abi-results
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-lifecycle.c abi-results/wifi-lifecycle-check.c \
            -o abi-results/check-wifi-lifecycle
          abi-results/check-wifi-lifecycle | tee abi-results/wifi-lifecycle-checks.txt
      - name: Verify complete NVRAM snapshot overflow handling
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-nvram-snapshot.py source
          python3 tools/band-steering/prepare-nvram-check.py source abi-results
          # Preserve the kernel's existing signed/size_t comparison unchanged.
          gcc -std=c11 -Wall -Wextra -Werror -Wno-sign-compare -O2 -fsanitize=address,undefined \
            abi-results/nvram-dump-check.c -o abi-results/check-nvram-dump
          abi-results/check-nvram-dump | tee abi-results/nvram-dump-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -Wno-sign-compare -msoft-float -c abi-results/nvram-dump-check.c -o abi-results/nvram-dump-mips.o
      - name: Verify immutable settings snapshot reader
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/settings-snapshot.c tools/band-steering/check-settings-snapshot.c \
            -o abi-results/check-settings-snapshot
          abi-results/check-settings-snapshot | tee abi-results/settings-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -c tools/band-steering/settings-snapshot.c -o abi-results/settings-snapshot-mips.o
      - name: Verify actual profile snapshot wrappers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-profile-snapshot.py source
          python3 tools/band-steering/prepare-profile-snapshot-check.py source abi-results
          cp source/band-steering-profile-snapshot.json abi-results/
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-settings-snapshot.c abi-results/profile-snapshot-check.c \
            -o abi-results/check-profile-snapshot
          abi-results/check-profile-snapshot | tee abi-results/profile-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -Iabi-results -c abi-results/profile-snapshot-check.c \
            -o abi-results/profile-snapshot-mips.o
      - name: Verify Wi-Fi apply snapshot capture and cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-wifi-snapshot.py source
          python3 tools/band-steering/prepare-wifi-check.py source abi-results/wifi-snapshot
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results/wifi-snapshot \
            abi-results/wifi-snapshot/wr-band-lifecycle.c \
            abi-results/wifi-snapshot/wr-band-settings-snapshot.c \
            abi-results/wifi-snapshot/wifi-lifecycle-check.c -o abi-results/check-wifi-snapshot
          abi-results/check-wifi-snapshot | tee abi-results/wifi-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -Iabi-results/wifi-snapshot -c abi-results/wifi-snapshot/wifi-lifecycle-check.c \
            -o abi-results/wifi-snapshot-mips.o
      - name: Prepare HNAT mode with coordinated source adapters
        run: |
          python3 tools/prepare-wifi-hwnat-mode.py source-integration --lan-only-default
          grep -q 'wifname, wr_radio_get_int("hw_nat_mode") == 1' source-integration/trunk/user/rc/net_wifi.c
          grep -q '{ "hw_nat_mode", "2" }' source-integration/trunk/user/shared/defaults.c
      - name: Verify status refresh UI behavior
        run: |
          node tools/band-steering/check-status-ui.js
          cmp tools/band-steering/status-ui.js source-integration/trunk/user/www/n56u_ribbon_fixed/wr-band-status.js
      - name: Verify read-only steering status observation
        shell: bash
        run: |
          set -euo pipefail
          cp -a source status-source
          python3 tools/band-steering/prepare-status-query.py status-source
          python3 tools/band-steering/prepare-status-check.py status-source --output abi-results/status-check.c
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined abi-results/status-check.c -o abi-results/status-check
          ASAN_OPTIONS=detect_leaks=1 abi-results/status-check
          python3 tools/band-steering/prepare-status-web.py status-source
          python3 tools/band-steering/prepare-status-web-check.py status-source --output abi-results/status-web-check.c
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined abi-results/status-web-check.c -o abi-results/status-web-check
          ASAN_OPTIONS=detect_leaks=1 abi-results/status-web-check
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c abi-results/status-check.c -o abi-results/status-check-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c abi-results/status-web-check.c -o abi-results/status-web-check-mips.o
      - name: Verify original radio snapshot settings and live status
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/check-radio-read-guard.py source abi-results/radio-read-guard
          python3 tools/band-steering/prepare-radio-snapshot.py source
          python3 tools/band-steering/prepare-radio-snapshot-check.py source abi-results/radio-snapshot
          python3 tools/band-steering/prepare-wifi-check.py source abi-results/radio-wifi-snapshot
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results/radio-snapshot \
            abi-results/radio-snapshot/wr-band-settings-snapshot.c \
            abi-results/radio-snapshot/radio-snapshot-check.c -o abi-results/check-radio-snapshot
          abi-results/check-radio-snapshot | tee abi-results/radio-snapshot-checks.txt
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results/radio-wifi-snapshot \
            abi-results/radio-wifi-snapshot/wr-band-lifecycle.c \
            abi-results/radio-wifi-snapshot/wr-band-settings-snapshot.c \
            abi-results/radio-wifi-snapshot/wifi-lifecycle-check.c -o abi-results/check-radio-wifi-snapshot
          abi-results/check-radio-wifi-snapshot | tee abi-results/radio-wifi-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -Iabi-results/radio-snapshot -c abi-results/radio-snapshot/radio-snapshot-check.c \
            -o abi-results/radio-snapshot-mips.o
      - name: Verify byte encoders and compile the MIPS adapter
