          test -n "$compiler"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('configs.build/wr1200js.config')
          lines = [l for l in p.read_text().splitlines()
                   if 'CONFIG_FIRMWARE_INCLUDE_WR_BAND_STEERING=' not in l]
