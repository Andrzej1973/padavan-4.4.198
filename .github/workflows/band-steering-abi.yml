name: Band Steering driver ABI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/band-steering-abi.yml'
      - 'tools/band-steering/prepare-abi-probe.py'
      - 'tools/band-steering/read-abi-probe.py'
      - 'tools/band-steering/protocol.c'
      - 'tools/band-steering/protocol.h'
      - 'tools/band-steering/check-protocol.c'
      - 'tools/band-steering/transport.c'
      - 'tools/band-steering/transport.h'
      - 'tools/band-steering/check-transport.c'
      - 'tools/band-steering/events.c'
      - 'tools/band-steering/events.h'
      - 'tools/band-steering/check-events.c'
      - 'tools/band-steering/framing.c'
      - 'tools/band-steering/framing.h'
      - 'tools/band-steering/check-framing.c'
      - 'tools/band-steering/wext-abi.c'
      - 'tools/band-steering/listener.c'
      - 'tools/band-steering/listener.h'
      - 'tools/band-steering/check-listener.c'
      - 'tools/band-steering/session.c'
      - 'tools/band-steering/session.h'
      - 'tools/band-steering/check-session.c'
      - 'tools/band-steering/clients.c'
      - 'tools/band-steering/aging.c'
      - 'tools/band-steering/aging.h'
      - 'tools/band-steering/check-aging.c'
      - 'tools/band-steering/policy.c'
      - 'tools/band-steering/policy.h'
      - 'tools/band-steering/check-policy.c'
      - 'tools/band-steering/grants.c'
      - 'tools/band-steering/grants.h'
      - 'tools/band-steering/check-grants.c'
      - 'tools/band-steering/coordinator.c'
      - 'tools/band-steering/coordinator.h'
      - 'tools/band-steering/check-coordinator.c'
      - 'tools/band-steering/loop.c'
      - 'tools/band-steering/loop.h'
      - 'tools/band-steering/main.c'
      - 'tools/band-steering/check-loop.c'
      - 'tools/band-steering/clients.h'
      - 'tools/band-steering/check-clients.c'
      - 'tools/band-steering/prepare-idle-aging.py'
      - 'tools/band-steering/prepare-idle-check.py'
      - 'tools/band-steering/prepare-grant-readback.py'
      - 'tools/band-steering/prepare-grant-check.py'
      - 'tools/band-steering/prepare-main-bss.py'
      - 'tools/band-steering/prepare-main-bss-check.py'
      - 'tools/band-steering/profile-policy.c'
      - 'tools/band-steering/profile-policy.h'
      - 'tools/band-steering/check-profile-policy.c'
      - 'tools/band-steering/prepare-profile-integration.py'
      - 'tools/band-steering/prepare-profile-snapshot.py'
      - 'tools/band-steering/prepare-profile-snapshot-check.py'
      - 'tools/band-steering/prepare-profile-check.py'
      - 'tools/band-steering/prepare-wifi-lifecycle.py'
      - 'tools/band-steering/prepare-wifi-check.py'
      - 'tools/band-steering/prepare-nvram-snapshot.py'
      - 'tools/band-steering/prepare-nvram-check.py'
      - 'tools/band-steering/settings-snapshot.c'
      - 'tools/band-steering/settings-snapshot.h'
      - 'tools/band-steering/check-settings-snapshot.c'
      - 'tools/band-steering/control.c'
      - 'tools/band-steering/ctl.c'
      - 'tools/band-steering/control-client.c'
      - 'tools/band-steering/control-client.h'
      - 'tools/band-steering/package/Makefile'
      - 'tools/band-steering/control-fixture-server.c'
      - 'tools/band-steering/check-control-client.py'
      - 'tools/band-steering/control.h'
      - 'tools/band-steering/lifecycle.c'
      - 'tools/band-steering/lifecycle.h'
      - 'tools/band-steering/check-lifecycle.c'
      - 'tools/band-steering/service-owner.c'
      - 'tools/band-steering/service-owner.h'
      - 'tools/band-steering/check-service-owner.c'
      - 'tools/band-steering/child-owner.c'
      - 'tools/band-steering/child-owner.h'
      - 'tools/band-steering/check-child-owner.c'
      - 'tools/band-steering/check-child-ready.c'
      - 'tools/band-steering/ready-daemon-fixture.c'
      - 'tools/band-steering/check-start.c'
      - 'tools/band-steering/spawn-fixture.c'
      - 'tools/band-steering/check-spawn.c'
      - 'tools/band-steering/check-control.c'
permissions:
  contents: read
jobs:
  inspect-driver-abi:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: vipshmily/padavan-4.4
          ref: c25283e915a2a00a763774dd255b14aff997285e
          path: source
          sparse-checkout: |
            trunk/user/rc
            trunk/linux-4.4.x/drivers/nvram
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x2/include
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x2/ap
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x3/include
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x3/ap
      - name: Prepare non-deauth idle-entry protocol
        run: python3 tools/band-steering/prepare-idle-aging.py source
      - name: Prepare read-only grant queries
        run: python3 tools/band-steering/prepare-grant-readback.py source
      - name: Prepare main-network-only legacy steering
        run: python3 tools/band-steering/prepare-main-bss.py source
      - name: Download and verify the firmware toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir toolchain
          curl --fail --location --retry 3 --output toolchain.tar.xz \
            https://github.com/vipshmily/padavan-4.4/releases/download/toolchain/mipsel-linux-uclibc.tar.xz
          echo 'de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256  toolchain.tar.xz' | sha256sum -c -
          tar -xJf toolchain.tar.xz -C toolchain
      - name: Generate and compile target ABI probes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-abi-probe.py source --output abi-results
          cp source/band-steering-idle-preparation.json abi-results/
          cp source/band-steering-grant-preparation.json abi-results/
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" --version > abi-results/compiler-version.txt
          git -C source rev-parse HEAD > abi-results/source-revision.txt
          for radio in mt76x2 mt76x3; do
            "$compiler" -std=gnu11 -mips32r2 -mabi=32 -msoft-float -O2 -c \
              "abi-results/$radio-abi.c" -o "abi-results/$radio-abi.o"
          done
          python3 tools/band-steering/read-abi-probe.py abi-results
          cp source/band-steering-main-bss-preparation.json abi-results/
          python3 tools/band-steering/prepare-main-bss-check.py source abi-results
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            abi-results/main-bss-check.c -o abi-results/check-main-bss
          abi-results/check-main-bss | tee abi-results/main-bss-checks.txt
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c abi-results/main-bss-check.c -o abi-results/main-bss-mips.o
      - name: Verify read-only profile compatibility policy
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/profile-policy.c tools/band-steering/check-profile-policy.c \
            -o abi-results/check-profile-policy
          abi-results/check-profile-policy | tee abi-results/profile-policy-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/profile-policy.c -o abi-results/profile-policy-mips.o
      - name: Verify rc profile integration candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-profile-integration.py source
          python3 tools/band-steering/prepare-profile-check.py source abi-results
          cp source/band-steering-profile-integration.json abi-results/
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-profile-policy.c abi-results/profile-integration-check.c \
            -o abi-results/check-profile-integration
          abi-results/check-profile-integration | tee abi-results/profile-integration-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -Iabi-results -c abi-results/profile-integration-check.c \
            -o abi-results/profile-integration-mips.o
      - name: Verify actual rc Wi-Fi lifecycle callbacks
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-child-reaper.py source
          python3 tools/band-steering/prepare-wifi-lifecycle.py source
          python3 tools/band-steering/prepare-wifi-check.py source abi-results
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-lifecycle.c abi-results/wifi-lifecycle-check.c \
            -o abi-results/check-wifi-lifecycle
          abi-results/check-wifi-lifecycle | tee abi-results/wifi-lifecycle-checks.txt
      - name: Verify complete NVRAM snapshot overflow handling
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-nvram-snapshot.py source
          python3 tools/band-steering/prepare-nvram-check.py source abi-results
          # Preserve the kernel's existing signed/size_t comparison unchanged.
          gcc -std=c11 -Wall -Wextra -Werror -Wno-sign-compare -O2 -fsanitize=address,undefined \
            abi-results/nvram-dump-check.c -o abi-results/check-nvram-dump
          abi-results/check-nvram-dump | tee abi-results/nvram-dump-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -Wno-sign-compare -msoft-float -c abi-results/nvram-dump-check.c -o abi-results/nvram-dump-mips.o
      - name: Verify immutable settings snapshot reader
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/settings-snapshot.c tools/band-steering/check-settings-snapshot.c \
            -o abi-results/check-settings-snapshot
          abi-results/check-settings-snapshot | tee abi-results/settings-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -c tools/band-steering/settings-snapshot.c -o abi-results/settings-snapshot-mips.o
      - name: Verify actual profile snapshot wrappers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-profile-snapshot.py source
          python3 tools/band-steering/prepare-profile-snapshot-check.py source abi-results
          cp source/band-steering-profile-snapshot.json abi-results/
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -Iabi-results \
            abi-results/wr-band-settings-snapshot.c abi-results/profile-snapshot-check.c \
            -o abi-results/check-profile-snapshot
          abi-results/check-profile-snapshot | tee abi-results/profile-snapshot-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -Iabi-results -c abi-results/profile-snapshot-check.c \
            -o abi-results/profile-snapshot-mips.o
      - name: Verify byte encoders and compile the MIPS adapter
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/protocol.c tools/band-steering/check-protocol.c \
            -o abi-results/check-protocol
          abi-results/check-protocol | tee abi-results/encoder-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/protocol.c -o abi-results/protocol-mips.o
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/protocol.c tools/band-steering/transport.c \
            tools/band-steering/check-transport.c -Wl,--wrap=ioctl \
            -o abi-results/check-transport
          abi-results/check-transport | tee abi-results/transport-checks.txt
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/transport.c -o abi-results/transport-mips.o
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            -Iabi-results tools/band-steering/events.c tools/band-steering/check-events.c \
            -o abi-results/check-events
          abi-results/check-events | tee abi-results/event-checks.txt
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -Iabi-results -c tools/band-steering/events.c -o abi-results/events-mips.o
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            -Iabi-results tools/band-steering/events.c tools/band-steering/framing.c \
            tools/band-steering/check-framing.c -o abi-results/check-framing
          abi-results/check-framing | tee abi-results/framing-checks.txt
          for file in framing wext-abi; do
            "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
              -msoft-float -O2 -Iabi-results -c "tools/band-steering/$file.c" -o "abi-results/$file-mips.o"
          done
      - name: Verify event listener and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            -Iabi-results tools/band-steering/events.c tools/band-steering/framing.c \
            tools/band-steering/listener.c tools/band-steering/check-listener.c \
            -Wl,--wrap=socket,--wrap=setsockopt,--wrap=bind,--wrap=close,--wrap=recvmsg \
            -o abi-results/check-listener
          abi-results/check-listener | tee abi-results/listener-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -Iabi-results -c tools/band-steering/listener.c -o abi-results/listener-mips.o
      - name: Verify session lifecycle and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/protocol.c tools/band-steering/session.c \
            tools/band-steering/check-session.c -o abi-results/check-session
          abi-results/check-session | tee abi-results/session-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/session.c -o abi-results/session-mips.o
      - name: Verify bounded client observations and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/clients.c tools/band-steering/check-clients.c \
            -o abi-results/check-clients
          abi-results/check-clients | tee abi-results/client-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/clients.c -o abi-results/clients-mips.o
      - name: Verify non-deauth client aging and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/clients.c tools/band-steering/aging.c \
            tools/band-steering/check-aging.c -o abi-results/check-aging
          abi-results/check-aging | tee abi-results/aging-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/aging.c -o abi-results/aging-mips.o
      - name: Verify preconnection policy and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/clients.c tools/band-steering/policy.c \
            tools/band-steering/check-policy.c -o abi-results/check-policy
          abi-results/check-policy | tee abi-results/policy-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/policy.c -o abi-results/policy-mips.o
      - name: Verify correlated grant controller and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/clients.c tools/band-steering/grants.c \
            tools/band-steering/check-grants.c -o abi-results/check-grants
          abi-results/check-grants | tee abi-results/grant-controller-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/grants.c -o abi-results/grants-mips.o
      - name: Verify integrated steering coordinator and compile for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/protocol.c tools/band-steering/session.c \
            tools/band-steering/clients.c tools/band-steering/aging.c \
            tools/band-steering/policy.c tools/band-steering/grants.c \
            tools/band-steering/coordinator.c tools/band-steering/check-coordinator.c \
            -o abi-results/check-coordinator
          abi-results/check-coordinator | tee abi-results/coordinator-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/coordinator.c -o abi-results/coordinator-mips.o
      - name: Verify local control socket and compile it for MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/control.c tools/band-steering/check-control.c \
            -o abi-results/check-control
          abi-results/check-control | tee abi-results/control-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c tools/band-steering/control.c -o abi-results/control-mips.o
      - name: Compile local administration client for host and MIPS
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 tools/band-steering/ctl.c tools/band-steering/control-client.c -o abi-results/wr-band-steering-ctl-host
          abi-results/wr-band-steering-ctl-host --help > abi-results/control-client-help.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 tools/band-steering/ctl.c tools/band-steering/control-client.c -o abi-results/wr-band-steering-ctl-mips
          "$(dirname "$compiler")/mipsel-linux-uclibc-readelf" -h -l -d \
            abi-results/wr-band-steering-ctl-mips > abi-results/control-client-mips-elf.txt
      - name: Verify actual administration client and local server exchange
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d /tmp/wr-ctl-check-XXXXXX)"
          sudo chown root:root "$test_dir"
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DWR_CONTROL_DIRECTORY=\""$test_dir"\" tools/band-steering/ctl.c tools/band-steering/control-client.c \
            -o abi-results/wr-control-client-fixture
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            tools/band-steering/control.c tools/band-steering/control-fixture-server.c \
            -o abi-results/wr-control-server-fixture
          sudo python3 tools/band-steering/check-control-client.py \
            "$PWD/abi-results/wr-control-client-fixture" \
            "$PWD/abi-results/wr-control-server-fixture" "$test_dir" \
            | tee abi-results/control-client-exchange.txt
          sudo rmdir "$test_dir"
      - name: Verify process event loop and link the daemon for MIPS
        shell: bash
        run: |
          set -euo pipefail
          base=(
            tools/band-steering/protocol.c tools/band-steering/session.c
            tools/band-steering/clients.c tools/band-steering/aging.c
            tools/band-steering/policy.c tools/band-steering/grants.c
            tools/band-steering/coordinator.c tools/band-steering/loop.c
          )
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            "${base[@]}" tools/band-steering/check-loop.c -o abi-results/check-loop
          abi-results/check-loop | tee abi-results/loop-checks.txt
          all=(
            "${base[@]}" tools/band-steering/events.c tools/band-steering/framing.c
            tools/band-steering/listener.c tools/band-steering/transport.c tools/band-steering/control.c tools/band-steering/main.c
          )
          gcc -std=c11 -Wall -Wextra -Werror -O2 -Iabi-results \
            "${all[@]}" -lrt -o abi-results/wr-band-steering-host
          abi-results/wr-band-steering-host --help | tee abi-results/daemon-help.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -Iabi-results "${all[@]}" -lrt -o abi-results/wr-band-steering-mips
          readelf="$(dirname "$compiler")/mipsel-linux-uclibc-readelf"
          test -x "$readelf"
          "$readelf" -h -l -d abi-results/wr-band-steering-mips > abi-results/daemon-mips-elf.txt
      - name: Build and stage candidate package with the target compiler
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          make -f tools/band-steering/package/Makefile romfs \
            SOURCE_DIR="$PWD/tools/band-steering" LAYOUT_DIR="$PWD/abi-results" \
            BUILD_DIR="$PWD/abi-results/package-build" INSTALLDIR="$PWD/abi-results/package-romfs" \
            CC="$compiler" CFLAGS="-O2 -mips32r2 -mabi=32 -msoft-float"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          root = Path('abi-results/package-romfs')
          files = sorted(p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file())
          assert files == ['usr/sbin/wr-band-steering', 'usr/sbin/wr-band-steering-ctl'], files
          for name in files:
              data = (root/name).read_bytes()
              assert data[:6] == b'\x7fELF\x01\x01' and struct.unpack_from('<H', data, 18)[0] == 8
          print('PASS two MIPS package binaries staged without startup hooks')
          PY
      - name: Verify coordinated profile lifecycle ordering
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/lifecycle.c tools/band-steering/check-lifecycle.c \
            -o abi-results/check-lifecycle
          abi-results/check-lifecycle | tee abi-results/lifecycle-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -c tools/band-steering/lifecycle.c -o abi-results/lifecycle-mips.o
      - name: Verify persistent service ownership decisions
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/band-steering/service-owner.c tools/band-steering/lifecycle.c tools/band-steering/check-service-owner.c \
            -o abi-results/check-service-owner
          abi-results/check-service-owner | tee abi-results/service-owner-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -c tools/band-steering/service-owner.c -o abi-results/service-owner-mips.o
      - name: Verify actual child completion and compile ownership helper
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            tools/band-steering/child-owner.c tools/band-steering/control-client.c tools/band-steering/check-child-owner.c \
            -o abi-results/check-child-owner
          abi-results/check-child-owner | tee abi-results/child-owner-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 \
            -msoft-float -c tools/band-steering/child-owner.c -o abi-results/child-owner-mips.o
      - name: Verify owned child readiness using real local IPC
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d /tmp/wr-ready-check-XXXXXX)"
          sudo chown root:root "$test_dir"
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DWR_CONTROL_DIRECTORY=\""$test_dir"\" \
            tools/band-steering/control.c tools/band-steering/control-client.c \
            tools/band-steering/child-owner.c tools/band-steering/check-child-ready.c \
            -o abi-results/check-child-ready
          sudo timeout 15 abi-results/check-child-ready "$test_dir/control" \
            | tee abi-results/child-ready-checks.txt
          sudo rmdir "$test_dir"
      - name: Verify foreground spawn and authenticated readiness
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d /tmp/wr-start-check-XXXXXX)"
          sudo chown root:root "$test_dir"
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DWR_READY_ENDPOINT=\""$test_dir/control"\" \
            tools/band-steering/control.c tools/band-steering/ready-daemon-fixture.c \
            -o abi-results/ready-daemon-fixture
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DWR_CONTROL_DIRECTORY=\""$test_dir"\" \
            -DWR_BAND_DAEMON_PATH=\""$PWD/abi-results/ready-daemon-fixture"\" \
            tools/band-steering/control-client.c tools/band-steering/child-owner.c \
            tools/band-steering/check-start.c -o abi-results/check-start
          sudo timeout 15 abi-results/check-start | tee abi-results/start-ready-checks.txt
          sudo rmdir "$test_dir"
      - name: Verify actual fixed executable spawn contract
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -O2 tools/band-steering/spawn-fixture.c \
            -o abi-results/spawn-fixture
          gcc -std=c11 -Wall -Wextra -Werror -O2 \
            -DWR_BAND_DAEMON_PATH=\""$PWD/abi-results/spawn-fixture"\" \
            tools/band-steering/child-owner.c tools/band-steering/control-client.c tools/band-steering/check-spawn.c \
            -o abi-results/check-spawn
          timeout 15 abi-results/check-spawn | tee abi-results/spawn-checks.txt
      - name: Check the prepared idle driver case
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-idle-check.py source abi-results
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            abi-results/check-idle-driver.c -o abi-results/check-idle-driver
          abi-results/check-idle-driver | tee abi-results/idle-driver-checks.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
            -msoft-float -O2 -c abi-results/check-idle-driver.c -o abi-results/idle-driver-case-mips.o
      - name: Check the actual read-only grant cases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/band-steering/prepare-grant-check.py source abi-results
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          for radio in mt76x2 mt76x3; do
            gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
              "abi-results/check-grant-$radio.c" -o "abi-results/check-grant-$radio"
            "abi-results/check-grant-$radio" | tee "abi-results/grant-$radio-checks.txt"
            "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 \
              -msoft-float -O2 -c "abi-results/check-grant-$radio.c" -o "abi-results/grant-case-$radio-mips.o"
          done
      - name: Upload ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-steering-mips-abi
          path: abi-results/
          if-no-files-found: warn
