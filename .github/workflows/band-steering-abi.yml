  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/shared-wifi/**'
      - 'tools/iot/**'
      - 'tools/connected-devices/**'
      - 'tools/prepare-shared-wifi.py'
      - '.github/workflows/band-steering-abi.yml'
