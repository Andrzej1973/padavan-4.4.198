      - 'tools/band-steering/check-child-owner.c'
      - 'tools/band-steering/check-child-ready.c'
      - 'tools/band-steering/ready-daemon-fixture.c'
      - 'tools/band-steering/check-start.c'
      - 'tools/band-steering/spawn-fixture.c'
      - 'tools/band-steering/check-spawn.c'
      - 'tools/band-steering/check-control.c'
permissions:
  contents: read
jobs:
  inspect-driver-abi:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: vipshmily/padavan-4.4
          ref: c25283e915a2a00a763774dd255b14aff997285e
          path: source
          sparse-checkout: |
            trunk/user/rc
            trunk/user/dnsmasq
            trunk/user/shared
            trunk/user/httpd
            trunk/user/www
            trunk/linux-4.4.x/drivers/nvram
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x2
            trunk/linux-4.4.x/drivers/net/wireless/mediatek/mt76x3
      - name: Verify steering package dependency checker logic
        run: python3 tools/band-steering/check-package-closure.py
      - name: Verify WR board steering selectors and factory OFF
        run: |
          python3 tools/band-steering/check-board-defaults.py source \
            overlay/padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config \
            board-defaults-checks --preprocessor gcc
      - name: Prepare non-deauth idle-entry protocol
        run: |
          mkdir source-integration
          cp -a source/trunk source-integration/
          mkdir -p source-integration/trunk/configs/boards/WR1200JS
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/kernel-4.4.x.config \
            source-integration/trunk/configs/boards/WR1200JS/
          python3 tools/band-steering/prepare-idle-aging.py source
      - name: Prepare read-only grant queries
        run: python3 tools/band-steering/prepare-grant-readback.py source
      - name: Prepare main-network-only legacy steering
        run: python3 tools/band-steering/prepare-main-bss.py source
      - name: Download and verify the firmware toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir toolchain
          curl --fail --location --retry 3 --output toolchain.tar.xz \
            https://github.com/vipshmily/padavan-4.4/releases/download/toolchain/mipsel-linux-uclibc.tar.xz
          echo 'de412846a5d057faf132b2463aa29c24f77c79c744f4181c1a287bbeaf1d7256  toolchain.tar.xz' | sha256sum -c -
          tar -xJf toolchain.tar.xz -C toolchain
      - name: Check conservative connected-device classification
        run: |
          node tools/connected-devices/check-classify.js
          node tools/connected-devices/check-roaming-view.js
          python3 tools/connected-devices/check-image-gate.py
          node tools/connected-devices/check-roaming.js
          node tools/connected-devices/check-rssi.js
          node tools/connected-devices/check-rssi-view.js
          node tools/connected-devices/check-refresh.js
          node tools/connected-devices/check-homepage.js

      - name: Check bounded passive connected-device source parser
        run: |
          set -euo pipefail
          mkdir -p abi-results
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-rssi-record.c -o abi-results/check-rssi-record
          abi-results/check-rssi-record
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-rssi-json-roundtrip.c -o abi-results/check-rssi-json-roundtrip
          abi-results/check-rssi-json-roundtrip > abi-results/rssi-json-samples.jsonl
          node tools/connected-devices/check-rssi-json-roundtrip.js abi-results/rssi-json-samples.jsonl
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-event.c -o abi-results/check-action-event
          abi-results/check-action-event
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-wire.c -o abi-results/check-action-wire
          abi-results/check-action-wire
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-receive.c -o abi-results/check-action-receive
          abi-results/check-action-receive
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-send.c -o abi-results/check-action-send
          abi-results/check-action-send
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-endpoint.c -o abi-results/check-action-endpoint
          abi-results/check-action-endpoint
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-channel.c -o abi-results/check-action-channel
          abi-results/check-action-channel
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-session.c -o abi-results/check-action-session
          abi-results/check-action-session
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-owner.c -o abi-results/check-action-owner
          abi-results/check-action-owner
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-drain.c -o abi-results/check-action-drain
          abi-results/check-action-drain
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-action-runtime.c -o abi-results/check-action-runtime
          abi-results/check-action-runtime
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined tools/connected-devices/check-steering-action.c -o abi-results/check-steering-action
          abi-results/check-steering-action
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-networkmap.c -o abi-results/check-device-networkmap
          abi-results/check-device-networkmap | tee abi-results/device-networkmap.txt
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-snapshot-json.c -o abi-results/check-device-json
          abi-results/check-device-json | tee abi-results/device-json.txt
          abi-results/check-device-json --json >abi-results/device-json-sample.json
          python3 tools/connected-devices/check-json-output.py abi-results/device-json-sample.json
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-snapshot-cache.c -o abi-results/check-device-cache
          abi-results/check-device-cache | tee abi-results/device-cache.txt
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-roaming-history.c -o abi-results/check-roaming-history
          abi-results/check-roaming-history | tee abi-results/roaming-history.txt
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-roaming-json.c -o abi-results/check-roaming-json
          abi-results/check-roaming-json
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-source-collector.c -o abi-results/check-device-source
          abi-results/check-device-source | tee abi-results/device-source.txt
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined tools/connected-devices/check-http-hook.c -o abi-results/check-device-http
          abi-results/check-device-http | tee abi-results/device-http.txt
          abi-results/check-device-http --json >abi-results/device-http-sample.json
          python3 -c 'import json; from pathlib import Path; value=json.loads(Path("abi-results/device-http-sample.json").read_text()); assert value["cacheState"]=="current" and value["sourceUpdatedAt"]>0 and value["devices"][0]["hostname"]=="<script>"' 
          mkdir -p abi-results/device-http-patch/trunk/user/httpd
          cp source/trunk/user/httpd/web_ex.c abi-results/device-http-patch/trunk/user/httpd/web_ex.c
          python3 tools/connected-devices/prepare-http.py abi-results/device-http-patch
          cp source/trunk/user/httpd/ralink.c abi-results/device-http-patch/trunk/user/httpd/ralink.c
          python3 tools/connected-devices/prepare-radio.py abi-results/device-http-patch
          cp source/trunk/user/httpd/httpd.c abi-results/device-http-patch/trunk/user/httpd/httpd.c
          python3 tools/connected-devices/prepare-background.py abi-results/device-http-patch
          python3 tools/connected-devices/check-prepare-http.py abi-results/device-http-patch abi-results/http-credentials.c
          gcc -std=c11 -Wall -Wextra -Werror abi-results/http-credentials.c -o abi-results/check-http-credentials
          abi-results/check-http-credentials
          python3 tools/connected-devices/check-prepare-ui.py source
          python3 tools/connected-devices/check-radio-source.py source
          python3 tools/connected-devices/check-kick-source.py source
          python3 tools/connected-devices/check-rssi-adapter.py source abi-results/rssi-adapter-source
          python3 tools/connected-devices/check-rssi-decision.py source abi-results/rssi-decision-source
          python3 tools/connected-devices/check-rssi-identity.py source abi-results/rssi-identity-source
          python3 tools/connected-devices/check-rssi-removal.py source abi-results/rssi-removal-source
          python3 tools/connected-devices/check-rssi-query.py source abi-results/rssi-query-source
          python3 tools/connected-devices/prepare-radio-header-check.py source abi-results/device-http-patch --output abi-results/device-radio-header.c
          gcc -std=gnu11 -Wall -Wextra -Werror abi-results/device-radio-header.c -o abi-results/device-radio-header
          abi-results/device-radio-header
          python3 tools/connected-devices/prepare-radio-layout.py source --output abi-results/device-radio-layout.c
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined abi-results/device-radio-layout.c -o abi-results/device-radio-layout
          abi-results/device-radio-layout
          python3 -c 'from pathlib import Path; s=Path("abi-results/device-http-patch/trunk/user/httpd/web_ex.c").read_text(); assert s.count("do_wr_devices_json,")==1; assert "application/json" in s; assert "NULL, do_wr_devices_json, 1" in s' 
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c abi-results/device-radio-header.c -o abi-results/device-radio-header-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-rssi-record.c -o abi-results/rssi-record-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-event.c -o abi-results/action-event-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-wire.c -o abi-results/action-wire-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-receive.c -o abi-results/action-receive-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-send.c -o abi-results/action-send-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-endpoint.c -o abi-results/action-endpoint-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-channel.c -o abi-results/action-channel-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-session.c -o abi-results/action-session-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-owner.c -o abi-results/action-owner-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-drain.c -o abi-results/action-drain-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-action-runtime.c -o abi-results/action-runtime-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-steering-action.c -o abi-results/steering-action-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c abi-results/device-radio-layout.c -o abi-results/device-radio-layout-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-roaming-history.c -o abi-results/roaming-history-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-roaming-json.c -o abi-results/roaming-json-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-networkmap.c -o abi-results/device-networkmap-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-snapshot-json.c -o abi-results/device-json-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-snapshot-cache.c -o abi-results/device-cache-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-source-collector.c -o abi-results/device-source-mips.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c tools/connected-devices/check-http-hook.c -o abi-results/device-http-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -mips32r2 -mabi=32 -msoft-float -c abi-results/http-credentials.c -o abi-results/http-credentials-mips.o

      - name: Compile IoT readiness headers after actual Padavan shared headers
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/iot/prepare-rc-header-check.py source abi-results/rc-header-includes
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/board.h abi-results/rc-header-includes/ralink_board.h
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          include_flags=(-I"$PWD/source/trunk/user/shared" -I"$PWD/tools/iot" -I"$PWD/abi-results/rc-header-includes")
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 "${include_flags[@]}" -c abi-results/rc-header-includes/positive.c -o abi-results/rc-header-positive-native.o
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float "${include_flags[@]}" -c abi-results/rc-header-includes/positive.c -o abi-results/rc-header-positive-mips.o
          if "$compiler" -std=gnu11 "${include_flags[@]}" -c abi-results/rc-header-includes/negative.c -o abi-results/rc-header-negative.o >abi-results/rc-header-negative.txt 2>&1; then
            echo 'Expected the original Padavan isblank/ctype collision to fail'
            exit 1
          fi
          grep -q isblank abi-results/rc-header-negative.txt
          echo 'PASS actual shared-header order; original collision reproduced and corrected headers compile' | tee abi-results/rc-header-regression.txt

      - name: Verify Wi-Fi HNAT mode on interface bring-up
        run: |
          cp -a source hwnat-mode-source
          python3 tools/prepare-wifi-hwnat-mode.py hwnat-mode-source --lan-only-default
          grep -q '{ "hw_nat_mode", "2" }' hwnat-mode-source/trunk/user/shared/defaults.c
          mkdir -p hwnat-mode-checks
          python3 tools/band-steering/prepare-hwnat-check.py hwnat-mode-source --output hwnat-mode-checks/check.c
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check.c -o hwnat-mode-checks/check
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check-network.c -o hwnat-mode-checks/check-network
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check-network
          gcc -std=c11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined hwnat-mode-checks/check-log.c -o hwnat-mode-checks/check-log
          ASAN_OPTIONS=detect_leaks=1 hwnat-mode-checks/check-log
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check.c -o hwnat-mode-checks/check-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check-network.c -o hwnat-mode-checks/check-network-mips.o
          "$compiler" -std=c11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -c hwnat-mode-checks/check-log.c -o hwnat-mode-checks/check-log-mips.o
      - name: Verify complete source preparation and registered target package
        shell: bash
        run: |
          set -euo pipefail
