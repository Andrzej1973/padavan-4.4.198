          import hashlib, json
          from pathlib import Path
          root = Path('source-integration')
          r = json.loads((root/'band-steering-source-integration.json').read_text())
          assert r['preparation_complete'] and not r['factory_enabled']
          assert not r['runtime_verified'] and len(r['steps']) == 22
          files = {}
          for name in ('wr-band-steering', 'wr-band-steering-ctl'):
              data = (root/'romfs/usr/sbin'/name).read_bytes()
              assert len(data) > 0
