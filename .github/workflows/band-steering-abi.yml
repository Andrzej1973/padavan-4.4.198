          (root/'package-checks.json').write_text(json.dumps({
              'target_compilation_verified': True, 'production_installed': False,
              'runtime_verified': False, 'factory_enabled': False, 'binaries': files,
              'scope': 'Complete source preparation and userspace package, not a complete integrated image'
          }, indent=2)+'\n')
