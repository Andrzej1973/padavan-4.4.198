            -c tools/iot/check-profile-line.c -o abi-results/iot-profile-line-mips.o

      - name: Check whole IoT profile before temporary output
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/check-profile-stream.c -o abi-results/check-iot-profile-stream
          abi-results/check-iot-profile-stream | tee abi-results/iot-profile-stream.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c tools/iot/check-profile-stream.c -o abi-results/iot-profile-stream-mips.o

      - name: Check atomic IoT profile replacement and write failures
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/check-profile-file.c -o abi-results/check-iot-profile-file
          abi-results/check-iot-profile-file | tee abi-results/iot-profile-file.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c tools/iot/check-profile-file.c -o abi-results/iot-profile-file-mips.o

      - name: Check IoT subnet and DHCP address validation
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/check-subnet.c -o abi-results/check-iot-subnet
          abi-results/check-iot-subnet | tee abi-results/iot-subnet.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c tools/iot/check-subnet.c -o abi-results/iot-subnet-mips.o

      - name: Check scoped IoT DHCP configuration fragment
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/check-dhcp.c -o abi-results/check-iot-dhcp
          abi-results/check-iot-dhcp | tee abi-results/iot-dhcp.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c tools/iot/check-dhcp.c -o abi-results/iot-dhcp-mips.o

      - name: Check IoT firewall fragment generation
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/check-firewall.c -o abi-results/check-iot-firewall
          abi-results/check-iot-firewall | tee abi-results/iot-firewall.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c tools/iot/check-firewall.c -o abi-results/iot-firewall-mips.o

      - name: Parse IoT rules with the host kernel in an isolated network namespace
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v iptables-legacy-restore >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y iptables
          fi
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 tools/iot/emit-firewall.c -o abi-results/emit-iot-firewall
          abi-results/emit-iot-firewall 4 > abi-results/iot-filter.v4
          abi-results/emit-iot-firewall 6 > abi-results/iot-filter.v6
          sudo unshare --net iptables-legacy-restore --test < abi-results/iot-filter.v4
          sudo unshare --net ip6tables-legacy-restore --test < abi-results/iot-filter.v6
          printf '%s\n' 'PASS host-kernel IPv4 and IPv6 restore grammar in isolated namespaces; target kernel and packet behavior unverified' | tee abi-results/iot-firewall-kernel-parser.txt

      - name: Exercise IoT isolation with host-kernel TCP packets
        shell: bash
        run: |
          set -euo pipefail
          command -v ip
          parent_netns="$(readlink /proc/self/ns/net)"
          sudo env WR_IOT_PARENT_NETNS="$parent_netns" unshare --net --mount --fork \
            python3 tools/iot/check-firewall-packets.py "$PWD/abi-results"

      - name: Check owned IoT bridge ioctls and guarded lifecycle
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            tools/iot/bridge.c tools/iot/check-bridge.c -o abi-results/check-iot-bridge
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          for source_file in bridge check-bridge; do
            "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
              -c "tools/iot/$source_file.c" -o "abi-results/iot-$source_file-mips.o"
          done
          parent_netns="$(readlink /proc/self/ns/net)"
          sudo env WR_IOT_PARENT_NETNS="$parent_netns" unshare --net --mount --fork \
            python3 tools/iot/check-bridge-kernel.py "$PWD/abi-results"

      - name: Prepare pinned RC IoT bridge and owned radio-stop hook
        shell: bash
        run: |
          set -euo pipefail
          cp -a source iot-rc-source
          mkdir -p iot-rc-source/trunk/configs/boards/WR1200JS
          cp overlay/padavan-4.4/trunk/configs/boards/WR1200JS/l1profile.dat iot-rc-source/trunk/configs/boards/WR1200JS/
          python3 tools/iot/prepare-rc.py iot-rc-source
          cp iot-rc-source/iot-rc-source.json abi-results/
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float \
            -c iot-rc-source/trunk/user/rc/wr-iot-bridge.c -o abi-results/iot-rc-bridge-mips.o

      - name: Check actual RC radio-stop behavior with and without WR ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/iot/prepare-stop-check.py iot-rc-source abi-results/check-iot-stop.c
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined -DBOARD_WR1200JS \
            abi-results/check-iot-stop.c -o abi-results/check-iot-stop-wr
          abi-results/check-iot-stop-wr | tee abi-results/iot-stop-wr.txt
          gcc -std=gnu11 -Wall -Wextra -Werror -O2 -fsanitize=address,undefined \
            abi-results/check-iot-stop.c -o abi-results/check-iot-stop-other
          abi-results/check-iot-stop-other | tee abi-results/iot-stop-other.txt
          compiler="$(find "$PWD/toolchain" -name mipsel-linux-uclibc-gcc -print -quit)"
          test -n "$compiler"
          "$compiler" -std=gnu11 -Wall -Wextra -Werror -O2 -mips32r2 -mabi=32 -msoft-float -DBOARD_WR1200JS \
            -c abi-results/check-iot-stop.c -o abi-results/iot-stop-mips.o

      - name: Upload ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: band-steering-mips-abi
          path: abi-results/
          if-no-files-found: warn
