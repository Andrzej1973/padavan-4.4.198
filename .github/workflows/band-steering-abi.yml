            CC="$compiler" CFLAGS="-O2 -mips32r2 -mabi=32 -msoft-float" \
            INSTALLDIR="$PWD/source-integration/romfs" romfs
          for name in wr-band-steering wr-band-steering-ctl; do
            "${compiler%gcc}readelf" -h "source-integration/romfs/usr/sbin/$name" \
              > "source-integration/$name-elf.txt"
            grep -q 'Machine:.*MIPS' "source-integration/$name-elf.txt"
          done
