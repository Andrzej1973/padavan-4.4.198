                    <div class="box">
                        <div class="heading"><#WRVPN_PROFILES_TITLE#></div>
                        <div class="content">
                            <span id="wr_vpn_action_text" style="display:none" data-edit="<#WRVPN_EDIT_SAVE#>" data-start="<#WRVPN_START#>" data-stop="<#WRVPN_STOP#>" data-delete="<#WRVPN_DELETE#>" data-confirm="<#WRVPN_DELETE_CONFIRM#>" data-error="<#WRVPN_REQUEST_FAILED#>" data-qrerror="<#WRVPN_QR_FAILED#>" data-hide="<#WRVPN_QR_HIDE#>"></span>
                            <span id="wr_vpn_link_text" style="display:none" data-check="<#WRVPN_OBSERVE#>" data-unknown="<#WRVPN_LINK_UNKNOWN#>" data-absent="<#WRVPN_LINK_ABSENT#>" data-up="<#WRVPN_LINK_UP#>" data-down="<#WRVPN_LINK_DOWN#>"></span>
                            <p><#WRVPN_CREATE_HELP#></p>
                            <p><#WRVPN_STORAGE_HELP#></p>
                            <label for="wr_vpn_create_id"><#WRVPN_ID#></label>
                            <input type="number" id="wr_vpn_create_id" min="1" max="999" value="1"/>
                            <select id="wr_vpn_create_protocol" aria-label="<#WRVPN_PROTOCOL#>">
                                <option value="wireguard">WireGuard</option>
                                <option value="amneziawg">AmneziaWG</option>
                            </select>
                            <label for="wr_vpn_create_config"><#WRVPN_CONFIG#></label>
                            <textarea id="wr_vpn_create_config" rows="8" style="width:95%;font-family:monospace" autocomplete="off" spellcheck="false"></textarea>
                            <button type="button" class="btn" id="wr_vpn_create_button" onclick="wrVPNCreate()"><#WRVPN_CREATE#></button>
                            <span id="wr_vpn_create_status" role="status" data-saved="<#WRVPN_CREATED#>" data-failed="<#WRVPN_CREATE_FAILED#>"></span>
                            <label for="wr_vpn_protect"><#WRVPN_PROTECT#></label>
                            <input type="text" id="wr_vpn_protect" maxlength="200" style="width:95%" value="<% nvram_get_x("", "wrvpn_protect"); %>"/>
                            <p id="wr_vpn_protect_help" data-required="<#WRVPN_PROTECT_REQUIRED#>"><#WRVPN_PROTECT_HELP#></p>
                            <table class="table table-bordered">
                                <thead>
                                    <tr>
                                        <th><#WRVPN_ID#></th>
                                        <th><#WRVPN_NAME#></th>
                                        <th><#WRVPN_REVISION#></th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="wr_vpn_rows">
                                    <% wr_vpn_profile_rows(); %>
                                </tbody>
                            </table>
                            <button type="button" class="btn" id="wr_vpn_previous" onclick="wrVPNListLoad(wrVPNListPage-1)" disabled><#WRVPN_PREVIOUS#></button>
                            <span id="wr_vpn_page_number">1</span>
                            <button type="button" class="btn" id="wr_vpn_next" onclick="wrVPNListLoad(wrVPNListPage+1)"><#WRVPN_NEXT#></button>
                            <button type="button" class="btn" id="wr_vpn_refresh" onclick="wrVPNListLoad(wrVPNListPage)"><#WRVPN_REFRESH#></button>
                            <div id="wr_vpn_editor" style="display:none">
                                <p><#WRVPN_EDIT_HELP#></p>
                                <span id="wr_vpn_edit_identity"></span>
                                <textarea id="wr_vpn_edit_config" rows="8" style="width:95%;font-family:monospace" autocomplete="off" spellcheck="false" aria-label="<#WRVPN_CONFIG#>"></textarea>
                                <button type="button" class="btn" id="wr_vpn_edit_save" onclick="wrVPNEditSave()"><#WRVPN_EDIT_SAVE#></button>
                                <button type="button" class="btn" id="wr_vpn_edit_cancel" onclick="wrVPNEditCancel()"><#WRVPN_EDIT_CANCEL#></button>
                                <span id="wr_vpn_edit_status" role="status" data-failed="<#WRVPN_EDIT_FAILED#>" data-saved="<#WRVPN_CREATED#>"></span>
                            </div>
                        </div>
                    </div>
                    <script type="text/javascript">
                    //<![CDATA[
                    var wrVPNToken = <% wr_vpn_token(); %>;
                    var wrVPNObservationGeneration = {};
                    var wrVPNListPage = 0, wrVPNListBusy = false;
                    var wrVPNEditing = null, wrVPNEditBusy = false, wrVPNEditGeneration = 0;
                    function wrVPNText(key) {
                        var text = document.getElementById('wr_vpn_action_text');
                        return text && text.getAttribute('data-' + key) || '?';
                    }
                    function wrVPNLocalizeRows() {
                        var text = document.getElementById('wr_vpn_link_text');
                        jQuery('.wr-vpn-observe').text(text.getAttribute('data-check'));
                        jQuery('.wr-vpn-up').text(wrVPNText('start'));
                        jQuery('.wr-vpn-down').text(wrVPNText('stop'));
                        jQuery('.wr-vpn-delete').text(wrVPNText('delete'));
                        jQuery('.wr-vpn-edit').text(wrVPNText('edit'));
                    }
                    function wrVPNListControls() {
                        var info = jQuery('#wr_vpn_rows .wr-vpn-page-info');
                        var page = info.attr('data-page'), total = info.attr('data-total');
                        if (!/^[0-9]{1,2}$/.test(page || '') || !/^[0-9]{1,3}$/.test(total || '')) return false;
                        wrVPNListPage = Number(page);
                        jQuery('#wr_vpn_refresh').prop('disabled', wrVPNListBusy);
                        jQuery('#wr_vpn_previous').prop('disabled', wrVPNListBusy || wrVPNListPage === 0);
                        jQuery('#wr_vpn_next').prop('disabled', wrVPNListBusy || (wrVPNListPage + 1) * 10 >= Number(total));
                        jQuery('#wr_vpn_page_number').text(String(wrVPNListPage + 1));
                        return true;
                    }
                    function wrVPNListLoad(page) {
                        if (wrVPNListBusy || page < 0 || page > 99 || page % 1 !== 0) return;
                        // Recreated rows must not retain an old observation whose timer
                        // still points to a detached DOM node, including rollback on error.
                        for (var id in wrVPNObservationGeneration) {
                            if (Object.prototype.hasOwnProperty.call(wrVPNObservationGeneration, id))
                                wrVPNObservationGeneration[id]++;
                        }
                        jQuery('#wr_vpn_rows [id^="wr_vpn_link_"]').text(document.getElementById('wr_vpn_link_text').getAttribute('data-unknown'));
                        wrVPNListBusy = true;
                        jQuery('#wr_vpn_previous, #wr_vpn_next, #wr_vpn_refresh').prop('disabled', true);
                        jQuery.ajax({url: '/update.cgi', dataType: 'html', cache: false, timeout: 5000,
                            data: {output: 'wr_vpn_profile_rows', arg0: page},
                            success: function(html) {
                                var previous = jQuery('#wr_vpn_rows').html();
                                jQuery('#wr_vpn_rows').html(html);
                                wrVPNListBusy = false;
                                if (!wrVPNListControls()) {
                                    jQuery('#wr_vpn_rows').html(previous);
                                    wrVPNListControls();alert(wrVPNText('error'));return;
                                }
                                wrVPNLocalizeRows();
                            }, error: function() {
                                wrVPNListBusy = false;wrVPNListControls();alert(wrVPNText('error'));
                            }});
                    }
                    jQuery(function() {wrVPNLocalizeRows();wrVPNListControls();});
                    function wrVPNObserve(id, button) {
                        var label = document.getElementById('wr_vpn_link_' + id);
                        var text = document.getElementById('wr_vpn_link_text');
                        if (!label || !text || button.disabled) return;
                        var generation = (wrVPNObservationGeneration[id] || 0) + 1;
                        wrVPNObservationGeneration[id] = generation;
                        button.disabled = true;
                        label.textContent = text.getAttribute('data-unknown');
                        function finish(key, sampled) {
                            if (wrVPNObservationGeneration[id] !== generation) return;
                            label.textContent = text.getAttribute('data-' + key);
                            button.disabled = false;
                            if (sampled) {
                                label.textContent += ' (' + new Date().toLocaleTimeString() + ')';
                                setTimeout(function() {
                                    if (wrVPNObservationGeneration[id] === generation)
                                        label.textContent = text.getAttribute('data-unknown');
                                }, 30000);
                            }
                        }
                        jQuery.ajax({url: '/update.cgi', dataType: 'json', cache: false, timeout: 5000,
                            data: {output: 'wr_vpn_profile_observation', arg0: id},
                            success: function(r) {
                                if (!r || r.id !== id || r.ownership !== 'unverified') return finish('unknown');
                                if (r.interface_state === 'absent' && r.up === null) return finish('absent', true);
                                if (r.interface_state === 'observed' &&
                                    (r.kind === 'wireguard' || r.kind === 'amneziawg')) {
                                    if (r.up === true) return finish('up', true);
                                    if (r.up === false) return finish('down', true);
                                }
                                finish('unknown');
                            }, error: function() { finish('unknown'); }});
                    }
                    function wrVPNEditCancel() {
                        if (wrVPNEditBusy) return;
                        wrVPNEditGeneration++;wrVPNEditing = null;
                        document.getElementById('wr_vpn_edit_config').value = '';
                        document.getElementById('wr_vpn_edit_identity').textContent = '';
                        document.getElementById('wr_vpn_editor').style.display = 'none';
                    }
                    function wrVPNEdit(id, revision) {
                        if (wrVPNEditBusy || !/^[1-9][0-9]{0,2}$/.test(String(id)) ||
                            !/^[1-9][0-9]{0,19}$/.test(revision)) return;
                        if (document.getElementById('wr_vpn_edit_config').value && !confirm(document.getElementById('wr_vpn_edit_cancel').textContent + '?')) return;
                        wrVPNEditCancel();
                        var generation = wrVPNEditGeneration;
                        var status = document.getElementById('wr_vpn_edit_status');
                        document.getElementById('wr_vpn_editor').style.display = '';
                        document.getElementById('wr_vpn_edit_save').disabled = true;
                        status.textContent = '';
                        jQuery.ajax({url: '/wr_vpn_export.cgi', type: 'POST', dataType: 'json', timeout: 8000,
                            data: {id: id, token: wrVPNToken, ack: '1'},
                            success: function(r) {
                                if (generation !== wrVPNEditGeneration) return;
                                if (!r || typeof r.config !== 'string' || !r.config) {
                                    status.textContent = status.getAttribute('data-failed');return;
                                }
                                wrVPNEditing = {id: id, revision: revision};
                                document.getElementById('wr_vpn_edit_identity').textContent = String(id) + ' / ' + revision;
                                document.getElementById('wr_vpn_edit_config').value = r.config;
                                document.getElementById('wr_vpn_edit_save').disabled = false;
                            }, error: function() {
                                if (generation === wrVPNEditGeneration) status.textContent = status.getAttribute('data-failed');
                            }});
                    }
                    function wrVPNEditSave() {
                        if (!wrVPNEditing || wrVPNEditBusy) return;
                        var config = document.getElementById('wr_vpn_edit_config');
                        var status = document.getElementById('wr_vpn_edit_status');
                        if (!config.value) {status.textContent = status.getAttribute('data-failed');return;}
                        wrVPNEditBusy = true;
                        config.disabled = true;
                        document.getElementById('wr_vpn_edit_save').disabled = true;
                        document.getElementById('wr_vpn_edit_cancel').disabled = true;
                        jQuery.ajax({url: '/wr_vpn_edit.cgi', type: 'POST', dataType: 'json', timeout: 8000,
                            contentType: 'text/plain; charset=UTF-8', processData: false,
                            data: wrVPNToken + '\n' + wrVPNEditing.id + '\n' + wrVPNEditing.revision + '\n' + config.value,
                            success: function(r) {finish(r && r.saved === true && r.started === false);},
                            error: function() {finish(false);}});
                        function finish(saved) {
                            wrVPNEditBusy = false;
                            config.disabled = false;
                            document.getElementById('wr_vpn_edit_cancel').disabled = false;
                            // Always require reopening before retry; the write may have committed.
                            document.getElementById('wr_vpn_edit_save').disabled = true;
                            wrVPNEditing = null;
                            if (saved) config.value = '';
                            status.textContent = status.getAttribute(saved ? 'data-saved' : 'data-failed');
                        }
                    }
                    function wrVPNCreate() {
                        var button = document.getElementById('wr_vpn_create_button');
                        var status = document.getElementById('wr_vpn_create_status');
                        var id = document.getElementById('wr_vpn_create_id').value;
                        var protocol = document.getElementById('wr_vpn_create_protocol').value;
                        var config = document.getElementById('wr_vpn_create_config');
                        if (button.disabled) return;
                        if (!/^[1-9][0-9]{0,2}$/.test(id) ||
                            !/^[0-9a-f]{32}$/.test(wrVPNToken) || !config.value ||
                            (protocol !== 'wireguard' && protocol !== 'amneziawg')) {
                            status.textContent = status.getAttribute('data-failed'); return;
                        }
                        button.disabled = true; status.textContent = '';
                        jQuery.ajax({url: '/wr_vpn_create.cgi', type: 'POST', dataType: 'json',
                            contentType: 'text/plain; charset=UTF-8', processData: false, timeout: 8000,
                            data: wrVPNToken + '\n' + id + '\n' + protocol + '\n' + config.value,
                            success: function(r) {
                                button.disabled = false;
                                if (r && r.saved === true && r.started === false) {
                                    config.value = '';
                                    status.textContent = status.getAttribute('data-saved');
                                } else status.textContent = status.getAttribute('data-failed');
                            },
                            error: function() {
                                button.disabled = false;
                                status.textContent = status.getAttribute('data-failed');
                            }});
                    }
                    function wrVPNAct(operation, id) {
                        if (operation == 'delete' && !confirm(wrVPNText('confirm').replace('{id}', id))) return;
                        var protect = jQuery('#wr_vpn_protect').val();
                        if (operation == 'up' && (!protect || protect.length > 200 ||
                            protect.split(',').length > 8 || !/^[0-9a-fA-F:.]+\/[0-9]{1,3}(,[0-9a-fA-F:.]+\/[0-9]{1,3})*$/.test(protect))) {
                            alert(document.getElementById('wr_vpn_protect_help').getAttribute('data-required')); return;
                        }
                        jQuery.ajax({url: '/wr_vpn_action.cgi', type: 'POST', dataType: 'json', timeout: 5000,
                            data: {operation: operation, id: id, protect: protect, ack: '1', token: wrVPNToken},
                            success: function (r) {
                                if (r && r.accepted) wrVPNPoll(id, 0);
                                else alert(wrVPNText('error'));
                            },
                            error: function () { alert(wrVPNText('error')); }});
                    }
                    function wrVPNPoll(id, count) {
                        jQuery.ajax({url: '/update.cgi', data: {output: 'wr_vpn_action_state', arg0: id},
                            dataType: 'json', cache: false, timeout: 5000,
                            success: function (r) {
                                if (r && (r.state == 'done' || r.state == 'failed' || r.state == 'timeout' ||
                                          r.state == 'overflow' || r.state == 'stale')) {
                                    location.reload();
                                } else if (count < 60) {
                                    setTimeout(function () { wrVPNPoll(id, count + 1); }, 1000);
                                }
                            },
                            error: function () {
                                if (count < 60) setTimeout(function () { wrVPNPoll(id, count + 1); }, 1000);
                            }});
                    }
                    function wrVPNQrHost() {
                        var box = document.getElementById('wr_vpn_qr_host');
                        if (!box) {
                            box = document.createElement('div');
                            box.id = 'wr_vpn_qr_host';
                            box.style.cssText = 'display:none;position:fixed;top:8%;left:50%;transform:translateX(-50%);z-index:9999;background:#fff;border:1px solid #999;padding:16px;max-width:92%;max-height:84%;overflow:auto;';
                            document.body.appendChild(box);
                        }
                        return box;
                    }
                    function wrVPNQrClose() {
                        var box = document.getElementById('wr_vpn_qr_host');
                        if (box) { box.innerHTML = ''; box.style.display = 'none'; }
                    }
                    function wrVPNQr(id) {
                        jQuery.ajax({url: '/wr_vpn_export.cgi', type: 'POST', dataType: 'json', timeout: 8000,
                            data: {id: id, ack: '1', token: wrVPNToken},
                            success: function (r) {
                                if (typeof wrVPNQrPayload != 'function' || typeof WRWifiQRCode != 'function') {
                                    alert(wrVPNText('qrerror')); return;
                                }
                                var payload = r && wrVPNQrPayload(r.config);
                                if (!payload) { alert(wrVPNText('qrerror')); return; }
                                var box = wrVPNQrHost();
                                box.innerHTML = '';
                                var qr = document.createElement('div');
                                qr.style.backgroundColor = 'white';
                                qr.style.padding = '16px';
                                box.appendChild(qr);
                                try { new WRWifiQRCode(qr, {text: payload, width: 256, height: 256}); }
                                catch (e) { alert(wrVPNText('qrerror')); return; }
                                var ta = document.createElement('textarea');
                                ta.rows = 6; ta.style.width = '100%'; ta.style.fontFamily = 'monospace';
                                ta.value = payload;
                                box.appendChild(ta);
                                var hide = document.createElement('button');
                                hide.type = 'button'; hide.className = 'btn'; hide.textContent = wrVPNText('hide');
                                hide.onclick = wrVPNQrClose;
                                box.appendChild(hide);
                                box.style.display = 'block';
                            },
                            error: function () { alert(wrVPNText('error')); }});
                    }
                    //]]>
                    </script>
